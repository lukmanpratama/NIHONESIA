<script>
const $=s=>document.querySelector(s),app=$('#app');
/* ===== PENYIMPANAN (localStorage di perangkat ini) ===== */
const ST={get(k,d){try{const v=localStorage.getItem('nh_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nh_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('nh_'+k)}catch(e){}}};
const day=o=>new Date(Date.now()+o*864e5).toLocaleDateString('sv');
let showR=ST.get('showR',true),auto=ST.get('auto',false);
const speak=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';speechSynthesis.speak(u)}catch(e){}};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
/* ===== ROMAJI: tombol ON/OFF di setiap halaman (elemen .ro disembunyikan saat OFF) ===== */
const rtBtn=()=>`<button class="rt${showR?' on':''}" aria-pressed="${showR}">Romaji ${showR?'ON':'OFF'}</button>`;
function setR(v){showR=v;ST.set('showR',v);document.body.classList.toggle('noro',!v);
 document.querySelectorAll('.rt').forEach(b=>{b.classList.toggle('on',v);b.setAttribute('aria-pressed',v);b.textContent='Romaji '+(v?'ON':'OFF')})}
document.body.classList.toggle('noro',!showR);
const hdr=t=>`<div class="top"><button class="bk">←</button><h2>${t}</h2>${rtBtn()}</div>`;
/* ===== JUMLAH SOAL (berlaku untuk semua kuis, disimpan) ===== */
const QOPTS=[10,15,20,25,30,35,40,45,50];
let qn=ST.get('qn',10);const QN=()=>qn;
// bar tombol kuis yang mengambang (bawah, atau atas jika up=true) + pilihan jumlah soal
const qbar=(b,up)=>{const n=(b.match(/<button/g)||[]).length;
 return`<div class="qbar${up?' up':''}"><div class="qcfg">Jumlah soal <select class="qn" aria-label="Jumlah soal">${QOPTS.map(x=>`<option ${x==qn?'selected':''}>${x}</option>`).join('')}</select></div><div class="qbtns" style="grid-template-columns:repeat(${n==4?2:Math.min(n,3)},1fr)">${b}</div></div>`};
function view(h,back){app.innerHTML=h;const b=$('.bk');if(b)b.onclick=back||home;document.querySelectorAll('.rt').forEach(x=>x.onclick=()=>setR(!showR));
 document.querySelectorAll('.qn').forEach(s=>s.onchange=()=>{qn=+s.value;ST.set('qn',qn)});const tp=$('.top');document.documentElement.style.setProperty('--hh',(tp?tp.offsetHeight:0)+'px');scrollTo(0,0)}
const onSpeak=el=>{el.onclick=e=>{const b=e.target.closest('[data-s]');if(b)speak(b.dataset.s)}};

/* ===== DATA ===== */
const H='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん';
const Rm='a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n'.split(' ');
const KA=[...H].map(c=>String.fromCharCode(c.charCodeAt(0)+96));
const RB={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n'};
const RY={ゃ:'a',ゅ:'u',ょ:'o'},RS={ぁ:'a',ぃ:'i',ぅ:'u',ぇ:'e',ぉ:'o'};
const rom=s=>{const c=[...s.replace(/[ァ-ヶ]/g,x=>String.fromCharCode(x.charCodeAt(0)-96))],o=[];
 for(let i=0;i<c.length;i++){const ch=c[i],n=c[i+1];
  if(ch=='っ'){o.push('\u0001');continue}
  if(ch=='ー'){const m=o.join('').match(/[aiueo](?=[^aiueo]*$)/);o.push(m?m[0]:'');continue}
  let r=RB[ch];if(r===undefined){o.push(RS[ch]||RY[ch]||ch);continue}
  if(RY[n]){r=/^(shi|chi|ji)$/.test(r)?r.slice(0,-1)+RY[n]:r.slice(0,-1)+'y'+RY[n];i++}
  else if(RS[n]){const v=RS[n];r=(r=='te'||r=='de')?r[0]+v:/^(shi|chi|ji)$/.test(r)?r.slice(0,-1)+v:r=='u'?'w'+v:r.endsWith('u')?r.slice(0,-1)+v:r+v;i++}
  o.push(r)}
 return o.map((r,i)=>{const nx=o[i+1]||'';if(r=='\u0001')return nx.startsWith('ch')?'t':/^[a-z]/.test(nx)?nx[0]:'';if(r=='n'&&/^[aiueoy]/.test(nx))return"n'";return r}).join('')};
// romaji untuk satu huruf kana (kotak susun kata); huruf kecil diberi keterangan
const romChar=c=>({ゃ:'ya',ゅ:'yu',ょ:'yo',ャ:'ya',ュ:'yu',ョ:'yo',っ:'(jeda)',ッ:'(jeda)',ー:'(panjang)'})[c]||rom(c);
const isKana=s=>/^[\u3040-\u30ffー\s・。、＿？！]+$/.test(s);
const RP={は:'wa',へ:'e',を:'o'}; // partikel dibaca berbeda
const romOpt=s=>RP[s]||rom(s);
const strip=s=>String(s).replace(/<[^>]*>/g,'');

/* Kosakata dimasukkan otomatis oleh build.js dari src/vocab/*.txt */
const VDATA=/*VOCAB*/null;
const V=VDATA.d.split('\n').map(l=>{const p=l.split('|');return{j:p[0],k:p[1],r:p[2],a:p[3],t:VDATA.t[p[4]],l:VDATA.l[p[5]]}});
const LV=VDATA.l,TY=[...VDATA.t].sort((a,b)=>a.localeCompare(b,'id'));

/* Kanji dimasukkan otomatis oleh build.js dari src/kanji.txt (+ urutan goresan KanjiVG) */
const KDATA=/*KANJI*/null;
const KJ=KDATA.d.map(r=>({k:r[0],kun:r[1]?r[1].split(','):[],on:r[2]?r[2].split(','):[],a:r[3],c:KDATA.c[r[4]],l:KDATA.l[r[5]],s:r[6],n:r[7]}));
const kunTxt=x=>x.replace(/\.(.*)/,'($1)');           // た.べる -> た(べる)
const kunR=x=>rom(x.replace('.',''));
const kjY=k=>[...k.kun.map(kunTxt),...k.on].join('・');
const kjYR=k=>[...k.kun.map(kunR),...k.on.map(rom)].join(' / ');

/* Kalimat Bun dimasukkan otomatis oleh build.js dari src/bun.txt: [kategori, jepang, romaji, arti] */
const BUN=/*BUN*/null;

/* Dialog Kaiwa dimasukkan otomatis oleh build.js dari src/kaiwa.txt: [kategori, judul, [[pembicara, jepang, romaji, arti], ...]] */
const KW=/*KAIWA*/null;
/* Materi bunpō dimasukkan otomatis oleh build.js dari src/bunpo.txt */
const BP=/*BUNPO*/null;
/* Goresan hiragana & katakana (KanjiVG) untuk kuis menulis */
const KANA=/*KANA*/null;
const STK=Object.assign({},KANA,Object.fromEntries(KJ.map(k=>[k.k,k.s])));

const PT=[
// [partikel, fungsi, contoh, arti, romaji contoh, romaji partikel]
['は','topik kalimat','わたしは がくせいです。','Saya (adalah) pelajar.','watashi wa gakusei desu.','wa'],
['が','subjek / penekanan','ねこが います。','Ada kucing.','neko ga imasu.','ga'],
['を','objek kata kerja','みずを のみます。','Minum air.','mizu o nomimasu.','o'],
['に','tujuan, waktu, keberadaan','しちじに おきます。','Bangun jam tujuh.','shichiji ni okimasu.','ni'],
['で','tempat aksi / alat','レストランで たべます。','Makan di restoran.','resutoran de tabemasu.','de'],
['へ','arah','がっこうへ いきます。','Pergi ke sekolah.','gakkou e ikimasu.','e'],
['と','bersama / dan','ともだちと はなします。','Bicara dengan teman.','tomodachi to hanashimasu.','to'],
['も','juga','わたしも がくせいです。','Saya juga pelajar.','watashi mo gakusei desu.','mo'],
['の','kepemilikan','わたしの ほん。','Buku saya.','watashi no hon.','no'],
['か','tanda tanya','これは ほんですか。','Apakah ini buku?','kore wa hon desu ka.','ka']];
// [soal, jawaban, romaji soal]
const PQ=[['わたし ＿ がくせい です。','は','watashi ＿ gakusei desu.'],['みず ＿ のみます。','を','mizu ＿ nomimasu.'],['がっこう ＿ いきます。','へ','gakkou ＿ ikimasu.'],['ともだち ＿ はなします。','と','tomodachi ＿ hanashimasu.'],['わたし ＿ ほん。','の','watashi ＿ hon.'],['レストラン ＿ たべます。','で','resutoran ＿ tabemasu.'],['しちじ ＿ おきます。','に','shichiji ＿ okimasu.'],['これは ほんです ＿ 。','か','kore wa hon desu ＿ .'],['わたし ＿ がくせい です。(juga)','も','watashi ＿ gakusei desu. (juga)'],['ねこ ＿ います。','が','neko ＿ imasu.']];

/* ===== KATSUYŌ (活用): mesin perubahan bentuk kata kerja =====
   Bentuk dihitung dari kana (v.k) lalu dipetakan ke tulisan kanji (v.j). */
const GROW={う:'わいうえお',く:'かきくけこ',ぐ:'がぎぐげご',す:'さしすせそ',つ:'たちつてと',ぬ:'なにぬねの',ぶ:'ばびぶべぼ',む:'まみむめも',る:'らりるれろ'};
const TEF={く:'いて',ぐ:'いで',す:'して',う:'って',つ:'って',る:'って',ぬ:'んで',ぶ:'んで',む:'んで'};
const HONO=['いらっしゃる','おっしゃる','なさる','くださる','ござる'];
// [id, nama bentuk, keterangan singkat, pembuat arti dari arti dasar]
const KF=[
 ['kamus','Bentuk kamus','辞書形 · bentuk dasar',a=>a],
 ['masu','Bentuk ます','sopan · sekarang/akan datang',a=>`${a} (sopan)`],
 ['masen','Bentuk ません','sopan · negatif',a=>`tidak ${a} (sopan)`],
 ['mashita','Bentuk ました','sopan · lampau',a=>`sudah ${a} (sopan)`],
 ['nai','Bentuk ない','biasa · negatif',a=>`tidak ${a}`],
 ['ta','Bentuk た','biasa · lampau',a=>`sudah ${a}`],
 ['nakatta','Bentuk なかった','biasa · negatif lampau',a=>`tidak ${a} (lampau)`],
 ['te','Bentuk て','penghubung, permintaan, sedang',a=>`${a}, lalu… (bentuk -te)`],
 ['tai','Bentuk たい','keinginan',a=>`ingin ${a}`],
 ['kanou','Bentuk potensial','可能形 · kemampuan',a=>`bisa ${a}`],
 ['ikou','Bentuk ajakan','意向形 · ajakan/niat',a=>`ayo ${a}`],
 ['ba','Bentuk ば','条件形 · syarat',a=>`jika ${a}`],
 ['meirei','Bentuk perintah','命令形 · perintah kasar',a=>`${a}! (perintah)`],
 ['ukemi','Bentuk pasif','受身形 · dikenai tindakan',a=>`dikenai "${a}" (pasif)`],
 ['shieki','Bentuk kausatif','使役形 · menyuruh/membiarkan',a=>`menyuruh/membiarkan ${a}`]];
const KFID=Object.fromEntries(KF.map(x=>[x[0],x]));
const kgroup=v=>/Godan/.test(v.t)?1:/Ichidan/.test(v.t)?2:3;
const GNAME={1:'Godan (Kelompok 1)',2:'Ichidan (Kelompok 2)',3:'Tidak beraturan (Kelompok 3)'};
function katsu(v){
 const k=v.k,g=kgroup(v),f={kamus:k};
 if(g==3){
  if(!/(する|くる)$/.test(k))return null;
  const p=k.slice(0,-2),base=k.endsWith('する')
   ?{masu:'します',nai:'しない',te:'して',ta:'した',tai:'したい',kanou:'できる',ikou:'しよう',ba:'すれば',meirei:'しろ',ukemi:'される',shieki:'させる'}
   :{masu:'きます',nai:'こない',te:'きて',ta:'きた',tai:'きたい',kanou:'こられる',ikou:'こよう',ba:'くれば',meirei:'こい',ukemi:'こられる',shieki:'こさせる'};
  for(const x in base)f[x]=p+base[x];
 }else if(g==2){
  if(!k.endsWith('る'))return null;const s=k.slice(0,-1);
  Object.assign(f,{masu:s+'ます',nai:s+'ない',te:s+'て',ta:s+'た',tai:s+'たい',kanou:s+'られる',ikou:s+'よう',ba:s+'れば',meirei:s+'ろ',ukemi:s+'られる',shieki:s+'させる'});
  if(k=='くれる'){f.meirei='くれ';f.kanou=f.ukemi=f.shieki=f.ikou=f.tai=null}
  if(k=='できる')f.kanou=f.ukemi=f.shieki=f.meirei=f.ikou=null;
 }else{
  const s=k.slice(0,-1),e=k.slice(-1),r=GROW[e];if(!r)return null;
  const iku=k.endsWith('いく')&&v.j.endsWith('行く');
  Object.assign(f,{masu:s+r[1]+'ます',nai:s+r[0]+'ない',te:s+(iku?'って':TEF[e]),tai:s+r[1]+'たい',kanou:s+r[3]+'る',ikou:s+r[4]+'う',ba:s+r[3]+'ば',meirei:s+r[3],ukemi:s+r[0]+'れる',shieki:s+r[0]+'せる'});
  f.ta=f.te.slice(0,-1)+(f.te.endsWith('で')?'だ':'た');
  if(HONO.includes(k)){f.masu=s+'います';f.meirei=s+'い';f.kanou=f.tai=f.ikou=f.ukemi=f.shieki=null}
  if(k=='ある'){f.nai='ない';f.kanou=f.ukemi=f.shieki=f.meirei=f.ikou=null}
  if(['分かる','要る'].includes(v.j))f.kanou=null;
 }
 f.masen=f.masu.slice(0,-2)+'ません';f.mashita=f.masu.slice(0,-2)+'ました';
 f.nakatta=f.nai.slice(0,-1)+'かった';
 return f}
// ubah bentuk kana menjadi tulisan kanji sesuai kata dasarnya
function kjForm(v,f){
 if(!f)return null;const j=v.j,k=v.k;if(j==k)return f;
 if(kgroup(v)==3){const p=k.slice(0,-2);
  if(j.endsWith('来る'))return j.slice(0,-2)+'来'+f.slice(p.length+1);
  if(j.endsWith('する'))return j.slice(0,-2)+f.slice(p.length);
  return f}
 const ks=k.slice(0,-1);
 if(j.slice(-1)!=k.slice(-1)||!f.startsWith(ks))return f;
 return j.slice(0,-1)+f.slice(ks.length)}
const vForms=v=>{const f=katsu(v);return KF.filter(x=>f&&f[x[0]]).map(x=>({id:x[0],lab:x[1],ket:x[2],kana:f[x[0]],jj:kjForm(v,f[x[0]]),arti:x[3](v.a)}))};
// 500 kata kerja: urut dari level termudah
const KV=(()=>{const LVO=['N5','Kerja','N4','N3','N2'],seen=new Set();
 return V.map((v,i)=>({...v,i})).filter(v=>/^Kata kerja/.test(v.t)&&v.j[0]!='〜'&&!/[ ・]/.test(v.k)&&!seen.has(v.j)&&seen.add(v.j)&&katsu(v))
  .sort((a,b)=>LVO.indexOf(a.l)-LVO.indexOf(b.l)||a.i-b.i).slice(0,500)})();

/* ===== SKOR & PROGRES ===== */
function trackStat(ok){
 const s=ST.get('stats',{ans:0,ok:0,last:'',streak:0}),d=day(0);
 if(s.last!==d){s.streak=s.last===day(-1)?s.streak+1:1;s.last=d}
 s.ans++;if(ok)s.ok++;ST.set('stats',s)}
function track(ok,it,ops){
 trackStat(ok);
 const m=ST.get('miss',{}),key=it.q+'¦'+it.a;
 if(ok){if(m[key]&&--m[key].c<=0)delete m[key]}
 else{m[key]={it:{q:it.q,a:it.a,d:ops.filter(x=>x!==it.a),e:it.e||'',say:it.say||null,qr:qRom(it),nr:!!it.nr},c:Math.min(3,(m[key]?m[key].c:0)+1)};
  const ks=Object.keys(m);ks.slice(0,Math.max(0,ks.length-300)).forEach(k=>delete m[k])}
 ST.set('miss',m)}
function saveScore(title,s,n){const S=ST.get('scores',{}),p=Math.round(s/n*100),r=S[title]||{best:0,n:0};
 const nb=r.n>0&&p>r.best;r.best=Math.max(r.best,p);r.last=p;r.n++;r.date=day(0);S[title]=r;ST.set('scores',S);return{nb,best:r.best}}
function streakNow(s){return s&&(s.last===day(0)||s.last===day(-1))?s.streak:0}
function prog(){
 const s=ST.get('stats',{ans:0,ok:0,last:'',streak:0}),S=ST.get('scores',{}),m=ST.get('miss',{}),mk=Object.keys(m);
 const rows=Object.entries(S).sort((a,b)=>b[1].date.localeCompare(a[1].date));
 view(`${hdr('Skor & Progres')}<div class="card stats"><div><b>🔥 ${streakNow(s)}</b><small>hari berturut-turut</small></div><div><b>${s.ans}</b><small>soal dijawab</small></div><div><b>${s.ans?Math.round(s.ok/s.ans*100):0}%</b><small>jawaban benar</small></div></div>
 ${mk.length?`<button class="pb" id="rv">Ulangi soal yang salah (${mk.length})</button>`:'<p class="sub">Belum ada soal yang salah untuk diulang.</p>'}
 <h3>Riwayat kuis</h3>${rows.length?`<div class="card wrap"><table><tr><th>Kuis</th><th>Terbaik</th><th>Terakhir</th><th>Main</th><th>Tanggal</th></tr>${rows.map(([t,r])=>`<tr><td>${t}</td><td>${r.best}%</td><td>${r.last}%</td><td>${r.n}×</td><td>${r.date}</td></tr>`).join('')}</table></div>`:'<p class="sub">Belum ada kuis yang dimainkan.</p>'}
 <p class="rj">Progres disimpan di browser perangkat ini.</p><button class="pb alt" id="rs">Hapus semua progres</button>`);
 if(mk.length)$('#rv').onclick=()=>quiz('Ulangi yang salah',()=>{const c=ST.get('miss',{});return Object.values(c).map(x=>x.it)},prog);
 $('#rs').onclick=()=>{if(confirm('Hapus semua skor, riwayat, dan daftar soal salah?')){['stats','scores','miss'].forEach(ST.del);prog()}}}

/* ===== QUIZ ENGINE ===== */
// items: array soal, atau fungsi yang membuat soal baru setiap kali kuis dimulai
// Field soal: q (soal), a (jawaban), d (pengecoh), e (keterangan), say (suara),
//   qr (romaji soal; jika tidak ada dibuat otomatis dari kana), nr (true = jangan tampilkan romaji di pilihan)
const qRom=it=>'qr' in it?it.qr:(isKana(strip(it.q))?rom(strip(it.q)):'');
const optHtml=(o,it)=>o+(!it.nr&&isKana(o)?`<small class="ro">${romOpt(o)}</small>`:'');
function quiz(title,items,back,n){
 n=n||QN();const src=typeof items=='function'?items():items;
 if(!src.length){view(`${hdr(title)}<p class="sub">Tidak ada soal.</p>`,back);return}
 const q=shuf(src).slice(0,n),pool=[...new Set(src.map(x=>x.a))];let i=0,s=0,st=0,bs=0;
 const next=()=>{
  if(i>=q.length){const r=saveScore(title,s,q.length);
   view(`${hdr(title)}<div class="card" style="text-align:center"><div class="big">${s}/${q.length}</div><p>${r.nb?'🏆 Rekor baru!':'Rekor terbaik: '+r.best+'%'}<br>Streak terbaik: ${bs}</p><button class="pb" id="again">Ulangi</button><button class="pb alt" id="sc">Lihat skor & progres</button></div>`,back);
   $('#again').onclick=()=>quiz(title,items,back,n);$('#sc').onclick=prog;return}
  const it=q[i],ops=shuf([it.a,...shuf([...new Set(it.d||pool)].filter(x=>x!==it.a)).slice(0,3)]);
  view(`${hdr(title)}<div class="meta">Soal ${i+1}/${q.length} · Skor ${s} · Streak ${st}</div><div class="card"><div class="qq">${it.q}</div>${qRom(it)?`<div class="ro qr">${qRom(it)}</div>`:''}${it.say?'<div style="text-align:center"><button class="sp" id="sp">🔊</button></div>':''}</div><div class="opts">${ops.map((o,k)=>`<button class="opt" data-k="${k}">${optHtml(o,it)}</button>`).join('')}</div><div id="fb"></div>`,back);
  if(it.say){$('#sp').onclick=()=>speak(it.say);if(auto)speak(it.say)}
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const ok=ops[b.dataset.k]===it.a;
   document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(ops[x.dataset.k]===it.a)x.classList.add('ok')});
   if(!ok)b.classList.add('no');
   if(ok){s++;st++;bs=Math.max(bs,st)}else st=0;
   track(ok,it,ops);
   $('#fb').innerHTML=`<p>${ok?'✅ Benar':'❌ Jawaban: '+optHtml(it.a,it)}${it.e?'<br><span class="rj">'+it.e+'</span>':''}</p><button class="pb" id="nx">Lanjut</button>`;
   $('#nx').onclick=()=>{i++;next()}})};
 next()}

/* ===== KUIS MENULIS =====
   item: {q (soal), qr (romaji soal), say (suara), chars:[huruf yang harus ditulis], ans (jawaban lengkap, html)}
   Dua mode (disimpan):
   - Bebas: tulis seluruh jawaban sekaligus di kanvas, lihat jawaban + panduan goresan, lalu nilai sendiri ✗/✓.
   - Cek otomatis: setiap goresan dicocokkan dengan data KanjiVG (posisi, arah, urutan), huruf per huruf. */
const NS=24,SVGNS='http://www.w3.org/2000/svg';
const smp=(()=>{const s=document.createElementNS(SVGNS,'svg');s.setAttribute('width','0');s.setAttribute('height','0');s.style.position='absolute';const p=document.createElementNS(SVGNS,'path');s.appendChild(p);document.body.appendChild(s);return p})();
const plen=a=>a.reduce((s,p,i)=>i?s+Math.hypot(p[0]-a[i-1][0],p[1]-a[i-1][1]):0,0);
function resample(a){if(a.length<2)return Array(NS).fill(a[0]);
 const d=[0];for(let i=1;i<a.length;i++)d.push(d[i-1]+Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]));
 const L=d[d.length-1]||1,o=[];let j=0;
 for(let k=0;k<NS;k++){const t=L*k/(NS-1);while(j<d.length-2&&d[j+1]<t)j++;const g=d[j+1]-d[j]||1,f=Math.min(1,Math.max(0,(t-d[j])/g));o.push([a[j][0]+(a[j+1][0]-a[j][0])*f,a[j][1]+(a[j+1][1]-a[j][1])*f])}
 return o}
const strokeCache={};
function expStroke(d){if(strokeCache[d])return strokeCache[d];smp.setAttribute('d',d);const L=smp.getTotalLength(),o=[];
 for(let k=0;k<NS;k++){const p=smp.getPointAtLength(L*k/(NS-1));o.push([p.x,p.y])}return strokeCache[d]={pts:o,len:L,d}}
function strokeOk(user,e){const u=resample(user),ul=plen(user),dot=e.len<14;
 if(!dot&&(ul<e.len*.35||ul>e.len*2.8))return false;
 const mean=u.reduce((s,p,i)=>s+Math.hypot(p[0]-e.pts[i][0],p[1]-e.pts[i][1]),0)/NS;
 if(dot)return mean<20;
 const st=Math.hypot(u[0][0]-e.pts[0][0],u[0][1]-e.pts[0][1]),en=Math.hypot(u[NS-1][0]-e.pts[NS-1][0],u[NS-1][1]-e.pts[NS-1][1]);
 return mean<17&&st<24&&en<24}
const canWrite=s=>[...s].every(c=>STK[c]&&STK[c].length);
// diagram urutan goresan kecil (nomor di titik awal setiap goresan)
const strokeSvg=c=>{const s=STK[c]||[];return`<svg class="sgd" viewBox="0 0 109 109" aria-label="Urutan goresan ${c}">${s.map(d=>`<path d="${d}"/>`).join('')}${s.map((d,j)=>{const m=d.match(/^[Mm]\s*([\d.]+)[ ,]+([\d.]+)/);return m?`<text x="${(+m[1]-6).toFixed(1)}" y="${(+m[2]-2).toFixed(1)}">${j+1}</text>`:''}).join('')}</svg>`};
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let wmode=ST.get('wmode','bebas');

function wquiz(title,items,back,n){
 n=n||QN();const src=typeof items=='function'?items():items;
 if(!src.length){view(`${hdr(title)}<p class="sub">Tidak ada soal yang bisa ditulis.</p>`,back);return}
 const q=shuf(src).slice(0,n);let i=0,s=0;
 const next=()=>{
  if(i>=q.length){const r=saveScore(title,s,q.length);
   view(`${hdr(title)}<div class="card" style="text-align:center"><div class="big">${s}/${q.length}</div><p>${r.nb?'🏆 Rekor baru!':'Rekor terbaik: '+r.best+'%'}</p><button class="pb" id="again">Ulangi</button><button class="pb alt" id="sc">Lihat skor & progres</button></div>`,back);
   $('#again').onclick=()=>wquiz(title,items,back,n);$('#sc').onclick=prog;return}
  const it=q[i];
  const done=ok=>{if(ok)s++;trackStat(ok);i++;next()};
  view(`${hdr(title)}<div class="wtop"><span class="meta" style="margin:0">Soal ${i+1}/${q.length} · Skor ${s}</span><button class="tg" id="wm">Mode: ${wmode=='bebas'?'Bebas':'Cek otomatis'} ⇄</button></div>
  <div class="card"><div class="qq">${it.q}</div>${it.qr?`<div class="ro qr">${it.qr}</div>`:''}${it.say?'<div style="text-align:center"><button class="sp" id="sp">🔊</button></div>':''}</div>
  <div id="warea"></div>`,back);
  if(it.say){$('#sp').onclick=()=>speak(it.say);if(auto)speak(it.say)}
  $('#wm').onclick=()=>{wmode=wmode=='bebas'?'ketat':'bebas';ST.set('wmode',wmode);next()};

 next()}

// ----- Mode bebas: tulis semuanya sekaligus, lalu nilai sendiri -----
function writeFree(it,box,done){
 const ch=it.chars,n=ch.length,W=800,H=n==1?800:n==2?520:400;
 box.innerHTML=`<div class="card wref" id="wref" hidden><div class="wans">${it.ans}</div><div class="sgrow">${ch.map(strokeSvg).join('')}</div></div>
 <canvas id="pad" class="wfree" width="${W}" height="${H}"></canvas>
 <div class="kctl"><button class="tg" id="wt">✍️ Jiplak</button><button class="tg" id="wg">👁 Panduan goresan</button><button class="tg" id="wc">🗑 Hapus</button></div>
 <div id="wact"><button class="pb" id="wshow">Lihat jawaban</button></div>`;
 const cv=$('#pad'),cx=cv.getContext('2d');let strokes=[],cur=null,trace=false;
 // kotak tiap huruf untuk panduan jiplak (dipusatkan)
 const sz=Math.min(H*.9,W*.94/n),x0=(W-sz*n)/2,y0=(H-sz)/2;
 const draw=()=>{cx.clearRect(0,0,W,H);cx.lineCap=cx.lineJoin='round';
  if(trace)ch.forEach((c,j)=>{cx.save();cx.translate(x0+j*sz,y0);cx.scale(sz/109,sz/109);cx.strokeStyle=cssv('--bd');cx.lineWidth=4;(STK[c]||[]).forEach(d=>cx.stroke(new Path2D(d)));cx.restore()});
  cx.strokeStyle=cssv('--fg');cx.lineWidth=Math.max(8,sz/26);
  strokes.forEach(st=>{cx.beginPath();st.forEach((p,j)=>j?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));if(st.length==1)cx.lineTo(st[0][0]+.1,st[0][1]);cx.stroke()})};
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);draw()};
 cv.onpointermove=e=>{if(cur){cur.push(pt(e));draw()}};
 cv.onpointerup=cv.onpointercancel=()=>{cur=null};
 $('#wc').onclick=()=>{strokes=[];draw()};
 $('#wt').onclick=e=>{trace=e.target.classList.toggle('on');draw()};
 $('#wg').onclick=e=>{const on=e.target.classList.toggle('on');$('#wref').hidden=!on&&!$('#wact').dataset.shown};
 $('#wshow').onclick=()=>{$('#wref').hidden=false;$('#wact').dataset.shown=1;if(it.say)speak(it.say);
  $('#wact').innerHTML=`<p class="rj" style="text-align:center;margin:12px 0 6px">Apakah tulisanmu benar?</p><div class="grade"><button class="gx" id="gno" aria-label="Salah">✗</button><button class="gv" id="gyes" aria-label="Benar">✓</button></div>`;
  $('#gno').onclick=()=>done(false);$('#gyes').onclick=()=>done(true)};
 draw()}

// ----- Mode cek otomatis: per goresan, huruf per huruf -----
function writeStrict(it,box,done){
 const ch=it.chars,E=ch.map(c=>(STK[c]||[]).map(expStroke)),total=E.reduce((a,x)=>a+x.length,0);
 let ci=0,si=0,miss=0,missHere=0,hints=0,hint=false,user=null,wrong=null,fin=false;
 box.innerHTML=`<div class="wbox" id="wb"></div><canvas id="pad" width="600" height="600"></canvas>
 <div class="kctl"><button class="tg" id="wh">💡 Petunjuk</button><button class="tg" id="wr">↺ Ulangi huruf</button><button class="tg" id="wg">Menyerah</button></div>
 <p class="rj" id="wst" style="text-align:center;margin:6px 0 0"></p><div id="fb"></div>`;
 const cv=$('#pad'),cx=cv.getContext('2d'),S=cv.width/109;
 const boxes=()=>{$('#wb').innerHTML=ch.length>1?ch.map((c,j)=>`<span class="${j<ci?'done':j==ci&&!fin?'cur':''}">${j<ci||fin?c:j==ci?'?':'·'}</span>`).join(''):'';
  $('#wst').textContent=fin?'':`Goresan ${si+1} dari ${E[ci].length}${ch.length>1?` · huruf ${ci+1} dari ${ch.length}`:''}${miss?` · salah ${miss}`:''}`};
 const line=(pts,col,w)=>{if(!pts||!pts.length)return;cx.strokeStyle=col;cx.lineWidth=w;cx.beginPath();pts.forEach((p,j)=>j?cx.lineTo(p[0]*S,p[1]*S):cx.moveTo(p[0]*S,p[1]*S));if(pts.length==1)cx.lineTo(pts[0][0]*S+.1,pts[0][1]*S);cx.stroke()};
 const path=(d,col,w)=>{cx.save();cx.scale(S,S);cx.strokeStyle=col;cx.lineWidth=w;cx.stroke(new Path2D(d));cx.restore()};
 const draw=()=>{cx.clearRect(0,0,cv.width,cv.height);cx.lineCap=cx.lineJoin='round';
  cx.save();cx.strokeStyle=cssv('--bd');cx.lineWidth=2;cx.setLineDash([8,8]);cx.beginPath();cx.moveTo(300,0);cx.lineTo(300,600);cx.moveTo(0,300);cx.lineTo(600,300);cx.stroke();cx.restore();
  const cur=E[ci]||[];
  if(fin)cur.forEach(e=>path(e.d,cssv('--fg'),4.5));
  else{if(hint&&cur[si])path(cur[si].d,cssv('--ac'),4);cur.slice(0,si).forEach(e=>path(e.d,cssv('--fg'),4.5))}
  line(wrong,cssv('--no'),14);line(user,cssv('--fg'),14);boxes()};
 const finish=gave=>{fin=true;cv.classList.add('off');
  const ok=!gave&&!hints&&miss<=Math.max(2,Math.round(total*.25));
  if(gave)ci=Math.min(ci,ch.length-1);draw();
  $('#fb').innerHTML=`<p>${ok?'✅ Benar':gave?'❌ Jawaban':'⚠️ Selesai'}${!gave&&!ok?` (salah ${miss} goresan${hints?', pakai petunjuk':''})`:''}: <b style="font-size:20px">${it.ans}</b></p><button class="pb" id="nx">Lanjut</button>`;
  document.querySelectorAll('#wh,#wr,#wg').forEach(b=>b.disabled=true);
  if(it.say)speak(it.say);$('#nx').onclick=()=>done(ok)};
 const skipEmpty=()=>{while(ci<ch.length&&!E[ci].length)ci++;if(ci>=ch.length){finish(false);return true}return false};
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*109,(e.clientY-r.top)/r.height*109]};
 cv.onpointerdown=e=>{if(fin)return;cv.setPointerCapture(e.pointerId);user=[pt(e)];draw()};
 cv.onpointermove=e=>{if(user){user.push(pt(e));draw()}};
 cv.onpointerup=cv.onpointercancel=()=>{if(!user||fin)return;const u=user;user=null;
  if(strokeOk(u,E[ci][si])){si++;missHere=0;hint=false;
   if(si>=E[ci].length){ci++;si=0;if(ci>=ch.length){finish(false);return}if(skipEmpty())return}}
  else{miss++;missHere++;wrong=u;if(missHere>=3)hint=true;setTimeout(()=>{wrong=null;if(!fin)draw()},450)}
  draw()};
 $('#wh').onclick=()=>{hint=true;hints++;draw()};
 $('#wr').onclick=()=>{si=0;hint=false;draw()};
 $('#wg').onclick=()=>finish(true);
 if(!skipEmpty())draw()}

 <div class="row2"><button class="pb alt" id="kp" ${i>0?'':'disabled'}>← ${i>0?P[i-1].k:''}</button><button class="pb alt" id="kn" ${i<P.length-1?'':'disabled'}>${i<P.length-1?P[i+1].k:''} →</button></div>
 <p class="rj" style="text-align:center">Data urutan goresan: <a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener" style="color:inherit">KanjiVG</a> (CC BY-SA 3.0)</p>`,kanji);
 onSpeak($('#ex'));

 if(i<P.length-1)$('#kn').onclick=()=>kanjiDetail(P[i+1],P);
 // animasi urutan goresan
 const ink=[...app.querySelectorAll('.ink path')],len=ink.map(p=>p.getTotalLength()+1);
 let step=0,run=0;
 const show=s=>{step=s;ink.forEach((p,j)=>{p.style.transition='none';p.style.strokeDasharray=len[j];p.style.strokeDashoffset=j<s?0:len[j];p.classList.toggle('cur',j==s-1)});$('#kcnt').textContent=`${s} / ${N} goresan`};
 const play=()=>{const id=++run;show(0);let j=0;
  const nx=()=>{if(id!=run||!ink[0].isConnected||j>=N)return;const p=ink[j],t=Math.max(250,len[j]*9);
   ink.forEach(x=>x.classList.remove('cur'));p.classList.add('cur');p.style.transition=`stroke-dashoffset ${t}ms linear`;p.getBoundingClientRect();p.style.strokeDashoffset=0;

  setTimeout(nx,300)};

 // latihan menulis di kanvas

  cx.save();cx.strokeStyle=css('--bd');cx.lineWidth=2;cx.setLineDash([8,8]);cx.beginPath();cx.moveTo(cv.width/2,0);cx.lineTo(cv.width/2,cv.height);cx.moveTo(0,cv.height/2);cx.lineTo(cv.width,cv.height/2);cx.stroke();cx.restore();
  if(guide){cx.save();cx.scale(S,S);cx.strokeStyle=css('--bd');cx.lineWidth=4;k.s.forEach(d=>cx.stroke(new Path2D(d)));cx.restore()}
  cx.strokeStyle=css('--fg');cx.lineWidth=18;strokes.forEach(s=>{cx.beginPath();s.forEach((p,j)=>j?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));if(s.length==1)cx.lineTo(s[0][0]+.1,s[0][1]);cx.stroke()})};
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};

const BP_STEP=[['N5','Kuasai partikel は・が・を・に・で, bentuk ます, ない, て, た, kata sifat, dan kalimat tanya.'],['N4','Latih perubahan kata kerja, pengalaman, syarat ～たら・～ば・～と・～なら, dan kewajiban.'],['N3','Belajar menyampaikan dugaan, pendapat, perubahan, pertentangan, dan hubungan sebab-akibat.'],['N2','Latih bacaan formal, argumen, kesimpulan, dan pola seperti ～ざるを得ない serta ～とは限らない.'],['N1','Pelajari ekspresi formal, tulisan abstrak, idiom, serta nuansa pola seperti ～を余儀なくされる dan ～ずにはいられない.']];
const bpEx=p=>`<div class="gx"><span>${p[3].replace(/\{(.+?)\}/g,'<b class="hl">$1</b>')}</span> <button class="sp" data-s="${p[3].replace(/[{}]/g,'')}">🔊</button><div class="ro" style="font-size:13px">${p[4]}</div><div class="rj">${p[5]}</div></div>`;
const bpFill=p=>[...p[3].matchAll(/\{(.+?)\}/g)].map(m=>m[1]).join(' … ');
const bub=e=>`<div class="bub">${e[0]} <button class="sp" data-s="${e[0]}">🔊</button><div class="rj ro">${e[1]}</div>${e[2]}</div>`;
function bunpo(){
 const tabs=[...BP.map(l=>l.l),'Perbandingan','Cara belajar'];
 if(!tabs.includes(bpL))bpL='N5';
 const lv=BP.find(l=>l.l==bpL);let body='',bar='';
 if(lv){
  const rows=bpRows(lv);
  body=`<div class="card"><b>${lv.l} · ${lv.t}</b> <span class="rj">(${rows.length} pola)</span><p class="rj" style="margin:4px 0 0">Fokus: ${lv.f}</p></div>
  ${lv.s.map(([t,r])=>`<h3>${t}</h3><div class="card">${r.map(p=>`<div class="gp"><div><b>${p[0]}</b><span class="ro">${p[1]}</span></div><div>${p[2]}</div>${p[3]?bpEx(p):''}</div>`).join('')}</div>`).join('')}
  ${lv.ex.length?`<h3>Contoh ${lv.l}</h3><div class="card">${lv.ex.map(bub).join('')}</div>`:''}
  ${lv.l=='N5'?`<details class="card"><summary><b>Contoh kalimat tiap partikel</b></summary>${PT.map(p=>`<div class="bub"><b>${p[0]}</b> <span class="ro">(${p[5]})</span> ${p[1]}<br>${p[2]} <button class="sp" data-s="${p[2]}">🔊</button><div class="rj ro">${p[4]}</div>${p[3]}</div>`).join('')}</details>`:''}`;
  bar=qbar(`<button class="pb" id="b1">Pola → arti</button><button class="pb" id="b2">Arti → pola</button><button class="pb" id="b4">Isi kalimat</button>${lv.l=='N5'?'<button class="pb" id="b3">Isi partikel</button>':''}`);
 }else if(bpL=='Perbandingan'){
  body=`<p class="sub">Ada pola yang tampak mirip, tetapi penggunaannya berbeda. Jangan hanya menghafal terjemahan bahasa Indonesia.</p>${BP_CMP.map(([t,ex])=>`<h3>${t}</h3><div class="card">${ex.map(bub).join('')}</div>`).join('')}`;
 }else{
  body=`<p class="sub">Jangan menghafal semua pola sekaligus. Urutkan berdasarkan fungsi, karena banyak pola tingkat tinggi memakai bentuk dasar yang dipelajari di N5 dan N4.</p>${BP_STEP.map(([l,t],i)=>`<div class="card"><b>Tahap ${i+1} — ${l}</b><p style="margin:4px 0 0">${t}</p></div>`).join('')}
  <div class="card"><b>Catatan penting</b><p class="rj" style="margin:4px 0 0">JLPT tidak menerbitkan daftar resmi tunggal yang menjamin setiap pola bunpō masuk ke level tertentu. Daftar di sini adalah peta belajar berdasarkan pengelompokan yang umum dipakai buku persiapan JLPT, jadi ada pola yang bisa dikelompokkan berbeda antarreferensi.</p></div>`;
 }
 view(`${hdr('Bunpo · 文法')}<div class="tabs">${tabs.map(t=>`<button class="tg${t==bpL?' on':''}" data-bt="${t}">${t}</button>`).join('')}</div>${lv?'':'<p class="sub" style="margin:0 0 8px">文法 (bunpō) = tata bahasa. Urutan belajar: N5 → N4 → N3 → N2 → N1.</p>'}${body}${bar}`);
 onSpeak(app);
 app.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{bpL=b.dataset.bt;ST.set('bpL',bpL);bunpo()});
 if(!lv)return;
 const rows=bpRows(lv),oth=r=>shuf(rows.filter(x=>x!==r&&!bpSame(x[2],r[2]))).slice(0,6),pat=r=>`${r[0]}<small class="ro">${r[1]}</small>`;
 $('#b1').onclick=()=>quiz(`Bunpo ${lv.l}: pola → arti`,()=>rows.map(r=>({q:r[0],qr:r[1],a:r[2],d:oth(r).map(x=>x[2])})),bunpo);
 $('#b2').onclick=()=>quiz(`Bunpo ${lv.l}: arti → pola`,()=>rows.map(r=>({q:r[2],qr:'',a:pat(r),d:oth(r).map(pat),nr:true})),bunpo);
 const exR=rows.filter(r=>r[3]);
 $('#b4').onclick=()=>quiz(`Bunpo ${lv.l}: isi kalimat`,()=>exR.map(r=>({q:`<span style="font-size:20px">${r[3].replace(/\{.+?\}/g,'<span class="blank">＿＿</span>')}</span><br><small class="rj" style="font-weight:400">${r[5]}</small>`,qr:'',a:bpFill(r),d:[...new Set(shuf(exR.filter(x=>x!==r&&!bpSame(x[2],r[2]))).map(bpFill))].filter(x=>x!==bpFill(r)).slice(0,6),e:`${r[3].replace(/[{}]/g,'')} <span class="ro">(${r[4]})</span><br>Pola: ${r[0]} — ${r[2]}`})),bunpo);
 if(lv.l=='N5')$('#b3').onclick=()=>quiz('Kuis partikel',PQ.map(p=>({q:p[0],a:p[1],qr:p[2]})),bunpo)}

/* ===== SUSUN ala Duolingo =====
   item: {q (soal), sub (petunjuk), tokens:[jawaban berurutan], extra:[ubin pengecoh], ans (html jawaban), say, kana (true = tampilkan romaji di ubin)} */
const SMALLK=/^[ぁぃぅぇぉゃゅょゎァィゥェォャュョヮー]$/;
const kanaTok=s=>[...s].reduce((a,c)=>{if(a.length&&SMALLK.test(c))a[a.length-1]+=c;else a.push(c);return a},[]);
const SEG=(()=>{try{return new Intl.Segmenter('ja',{granularity:'word'})}catch(e){return null}})();
const PARTS=new Set(['は','が','を','に','で','へ','と','も','の','か','ね','よ','や','から','まで','より','など','けど','ので','のに','って','わ','な','さ','ぞ']);
// akhiran kata kerja/sifat pendek yang ikut ditempel ke kata sebelumnya
const AUX=new Set(['て','た','だ','い','る','う','し','ん','れ','せ','ず','く','け','ろ','ば','たら','だら','たり','だり','ても','たい','よう','そう','さい']);
// potong kalimat menjadi ubin kata: partikel, akhiran, dan tanda baca ditempel ke kata sebelumnya
function sentTok(s){
 const raw=SEG?[...SEG.segment(s)].map(x=>x.segment):(s.match(/[一-龯々〆ヵヶ]+[ぁ-ゖ]*|[ァ-ヺー]+|[ぁ-ゖ]+|[A-Za-z0-9-]+|./g)||[]);
 const out=[];let pre='';
 const KJR=/[一-龯々〆ヵヶ0-9０-９]$/,KJONLY=/^[一-龯々〆ヵヶ0-9０-９]+$/;
 for(let t of raw){if(!t.trim())continue;
  const last=out.length?out[out.length-1]:'';
  // okurigana: hiragana setelah kanji (bukan partikel) ikut kata kanjinya, mis. 食+べ → 食べ
  if(!pre&&last&&KJR.test(last)&&/^[ぁ-ゖ]+$/.test(t)&&![...PARTS].some(p=>t.startsWith(p))){out[out.length-1]+=t;continue}
  // kanji tunggal digabung dengan kanji di sebelahnya, mis. 五+足 → 五足
  if(!pre&&last&&KJONLY.test(last)&&KJONLY.test(t)&&(last.length==1||t.length==1)){out[out.length-1]+=t;continue}
  // satu huruf hiragana lepas (mis. awalan お/ご) digabung ke kata berikutnya
  if(/^[ぁ-ゖ]$/.test(t)&&!PARTS.has(t)&&!AUX.has(t)){pre+=t;continue}
  t=pre+t;pre='';const prev=out.length?out[out.length-1]:null;
  const glue=prev&&!/^[「『（(]+$/.test(prev)&&(/^[。、！？!?」』）)…・〜～.,]+$/.test(t)||PARTS.has(t)||AUX.has(t)||/^(ます|まし|ませ|です|でし|ない|なかっ|てい|でい|られ|させ|ござい|した|しょう|せん)/.test(t));
  if(prev&&(glue||/^[「『（(]+$/.test(prev)))out[out.length-1]+=t;else out.push(t)}
 if(pre){if(out.length)out[out.length-1]+=pre;else out.push(pre)}
 while(out.length>9){let mi=0,ml=1e9;for(let i=0;i<out.length-1;i++){const l=out[i].length+out[i+1].length;if(l<ml){ml=l;mi=i}}out.splice(mi,2,out[mi]+out[mi+1])}
 return out}
// soal susun kalimat dari daftar {j, r, a, sub?}; pengecoh diambil dari kalimat lain di pool
function sentItems(list,pool){
 return list.map(x=>{const tk=sentTok(x.j);if(tk.length<2)return null;
  const ex=[];for(const p of shuf(pool)){if(ex.length>=3)break;const t=shuf(sentTok(p))[0];if(t&&!tk.includes(t)&&!ex.includes(t))ex.push(t)}
  return{q:x.a,sub:x.sub||'',tokens:tk,extra:ex,ans:`${x.j}<div class="ro" style="font-size:14px">${x.r}</div>`,say:x.j}}).filter(Boolean)}
function kanaExtra(tokens,pool,n=3){const ex=[];for(const c of shuf(pool)){if(ex.length>=n)break;if(!tokens.includes(c)&&!ex.includes(c))ex.push(c)}return ex}
const HIRA=[...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだでどばびぶべぼぱぴぷぺぽ'];
const KATA=HIRA.map(toKata);

function susun(title,items,back,n){
 n=n||QN();const src=typeof items=='function'?items():items;
 if(!src.length){view(`${hdr(title)}<p class="sub">Tidak ada soal.</p>`,back);return}
 const q=shuf(src).slice(0,n);let i=0,s=0;
 const next=()=>{
  if(i>=q.length){const r=saveScore(title,s,q.length);
   view(`${hdr(title)}<div class="card" style="text-align:center"><div class="big">${s}/${q.length}</div><p>${r.nb?'🏆 Rekor baru!':'Rekor terbaik: '+r.best+'%'}</p><button class="pb" id="again">Ulangi</button><button class="pb alt" id="sc">Lihat skor & progres</button></div>`,back);
   $('#again').onclick=()=>susun(title,items,back,n);$('#sc').onclick=prog;return}
  const it=q[i],bank=shuf([...it.tokens,...it.extra].map((t,x)=>({t,x})));let pick=[],done=false;
  const chip=(o,used)=>`<button class="stk${used?' used':''}" data-x="${o.x}">${o.t}${it.kana?`<small class="ro">${romChar(o.t)}</small>`:''}</button>`;
  view(`${hdr(title)}<div class="meta">Soal ${i+1}/${q.length} · Skor ${s} · 🧩 Susun jawabannya</div>
  <div class="card"><div class="qq" style="font-size:21px">${it.q}</div>${it.sub?`<div class="rj" style="text-align:center">${it.sub}</div>`:''}</div>
  <div class="sline" id="sl"></div><div class="sbank" id="sb"></div><div id="fb"></div><button class="pb" id="chk" disabled>Periksa</button>`,back);
  const draw=()=>{
   $('#sl').innerHTML=pick.map(o=>chip(o,false)).join('')||'<span class="rj">Ketuk ubin di bawah untuk menyusun jawaban</span>';
   $('#sb').innerHTML=bank.map(o=>chip(o,pick.includes(o))).join('');
   $('#chk').disabled=!pick.length||done;
   if(done)return;
   $('#sl').querySelectorAll('.stk').forEach(b=>b.onclick=()=>{pick=pick.filter(o=>o.x!=b.dataset.x);draw()});
   $('#sb').querySelectorAll('.stk:not(.used)').forEach(b=>b.onclick=()=>{pick.push(bank.find(o=>o.x==b.dataset.x));draw()})};
  $('#chk').onclick=()=>{done=true;const ok=pick.map(o=>o.t).join('')===it.tokens.join('');if(ok)s++;trackStat(ok);draw();
   $('#chk').style.display='none';
   $('#fb').innerHTML=`<div class="fbx ${ok?'ok':'no'}"><b>${ok?'✅ Benar!':'❌ Jawaban yang benar:'}</b><div style="font-size:20px;margin-top:4px">${it.ans}</div>${it.say?'<button class="sp" id="sp2">🔊</button>':''}</div><button class="pb" id="nx">Lanjut</button>`;
   if(it.say){speak(it.say);$('#sp2').onclick=()=>speak(it.say)}
   $('#nx').onclick=()=>{i++;next()}};
  draw()};
 next()}

 view(`${hdr('Kaiwa · Percakapan')}<select id="kwc"><option value="">Semua kategori (${KW.length} dialog)</option>${KWC.map(c=>`<option ${c==kwC?'selected':''} value="${c}">${c} (${KW.filter(d=>d[0]==c).length})</option>`).join('')}</select>
 ${D.map(d=>`<h3>${d[1]}${kwC?'':` <span class="rj">· ${d[0]}</span>`}</h3><div class="card">${d[2].map(l=>`<div class="bub"><b>${l[0]}</b>: ${l[1]} <button class="sp" data-s="${l[1]}">🔊</button><div class="rj ro">${l[2]}</div>${l[3]}</div>`).join('')}</div>`).join('')}${qbar('<button class="pb" id="q1">Arti kalimat</button><button class="pb" id="q2">Kalimat berikutnya</button>')}`);
 onSpeak(app);
 $('#kwc').onchange=e=>{kwC=e.target.value;ST.set('kwC',kwC);kaiwa()};
 const ln=D.flatMap((d,di)=>d[2].map((l,li)=>({di,li,t:d[1],sp:l[0],j:l[1],r:l[2],a:l[3]})));
 const all=KW.flatMap(d=>d[2].map(l=>({j:l[1],r:l[2],a:l[3]})));
 const opt=l=>`${l.j}<small class="ro">${l.r}</small>`;
 const nm=m=>`Kaiwa${kwC?' '+kwC:''}: ${m}`;
 // pengecoh diambil dari semua dialog supaya pilihan tetap cukup walau kategori kecil
 $('#q1').onclick=()=>quiz(nm('arti kalimat'),()=>ln.map(l=>({q:l.j,qr:l.r,say:l.j,a:l.a,d:shuf(all.filter(x=>x.a!=l.a)).slice(0,6).map(x=>x.a)})),kaiwa);
 $('#q2').onclick=()=>quiz(nm('kalimat berikutnya'),()=>ln.filter(l=>D[l.di][2][l.li+1]).map(l=>{const n=ln.find(x=>x.di==l.di&&x.li==l.li+1);
  return{q:`<small class="rj">${l.t}</small><br><b>${l.sp}:</b> ${l.j}<br><small class="rj">Apa kalimat berikutnya?</small>`,qr:l.r,say:l.j,a:opt(n),d:shuf(all.filter(x=>x.j!=n.j&&x.j!=l.j)).slice(0,6).map(opt),nr:true,e:`${n.sp}: ${n.a}`}}),kaiwa)}

/* ----- TEKA-TEKI: semua mode susun + tebak teka-teki ----- */
let pzL=ST.get('pzL','');
const PZ=[
 ['hira','あ','Susun Hiragana','Susun huruf hiragana menjadi kata'],
 ['kata','ア','Susun Katakana','Susun huruf katakana menjadi kata serapan'],
 ['kotoba','語','Susun Kotoba','Susun cara baca kata berkanji'],
 ['katsu','活','Susun Katsuyō','Susun bentuk perubahan kata kerja'],
 ['bunpo','法','Susun Bunpo','Susun contoh kalimat tata bahasa'],
 ['kaiwa','話','Susun Kaiwa','Susun kalimat percakapan'],
 ['bun','文','Susun Bun','Susun kalimat sehari-hari'],
 ['tebak','💡','Tebak teka-teki','Teka-teki Jepang klasik']];
function puzzle(){
 view(`${hdr('Teka-teki · Susun')}<p class="sub">Susun ubin menjadi jawaban yang benar, seperti di Duolingo. Ketuk ubin untuk memindahkannya, ketuk lagi untuk mengembalikan.</p>
 <div class="row2"><select id="pzl"><option value="">Semua level</option>${['N5','N4','N3','N2','N1','Kerja'].map(x=>`<option ${x==pzL?'selected':''}>${x}</option>`).join('')}</select><div class="qcfg" style="justify-content:flex-end">Jumlah soal <select class="qn">${QOPTS.map(x=>`<option ${x==qn?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <div class="grid">${PZ.map(p=>`<button class="mc" data-pz="${p[0]}"><span class="ic">${p[1]}</span><b>${p[2]}</b><small>${p[3]}</small></button>`).join('')}</div>
 <p class="rj" style="margin-top:12px">Level berlaku untuk Susun Hiragana, Katakana, Kotoba, Katsuyō, dan Bunpo.</p>`);
 $('#pzl').onchange=e=>{pzL=e.target.value;ST.set('pzL',pzL)};
 app.querySelectorAll('[data-pz]').forEach(b=>b.onclick=()=>pzStart(b.dataset.pz))}
function pzStart(m){
 const lvOk=v=>!pzL||v.l==pzL,L=pzL?` ${pzL}`:'',N=()=>QN();
 const word=(v,pool)=>{const tk=kanaTok(v.k);return{q:v.a,sub:v.t,tokens:tk,extra:kanaExtra(tk,pool),ans:`${v.j}${v.j!=v.k?` <span class="rj">${v.k}</span>`:''} <span class="ro">(${v.r})</span>`,say:v.k,kana:true}};
 const okLen=v=>{const n=kanaTok(v.k).length;return n>=2&&n<=7&&v.j[0]!='〜'&&!/[ ・]/.test(v.k)};
 if(m=='hira')return susun(`Susun Hiragana${L}`,()=>shuf(V.filter(v=>lvOk(v)&&okLen(v)&&/^[ぁ-ゖ]+$/.test(v.k))).slice(0,N()).map(v=>word(v,HIRA)),puzzle);
 if(m=='kata')return susun(`Susun Katakana${L}`,()=>shuf(V.filter(v=>lvOk(v)&&okLen(v)&&/^[ァ-ヺー]+$/.test(v.k))).slice(0,N()).map(v=>word(v,KATA)),puzzle);
 if(m=='kotoba')return susun(`Susun Kotoba${L}`,()=>shuf(V.filter(v=>lvOk(v)&&okLen(v)&&v.j!=v.k)).slice(0,N()).map(v=>({...word(v,HIRA),q:`<span style="font-size:30px">${v.j}</span>`,sub:`${v.a} · susun cara bacanya`})),puzzle);
 if(m=='katsu')return susun(`Susun Katsuyō${L}`,()=>shuf(KV.filter(lvOk)).slice(0,N()).map(v=>{const F=vForms(v).filter(x=>x.id!='kamus'),f=F[Math.floor(Math.random()*F.length)],tk=kanaTok(f.kana);
   return{q:`${f.lab} dari <b>${v.j}</b>`,sub:`${v.a} → ${f.arti}`,tokens:tk,extra:kanaExtra(tk,[...new Set(F.flatMap(x=>kanaTok(x.kana)))]),ans:`${f.jj}${f.jj!=f.kana?` <span class="rj">${f.kana}</span>`:''} <span class="ro">(${rom(f.kana)})</span>`,say:f.kana,kana:true}}),puzzle);
 if(m=='bunpo'){const ex=BP.filter(l=>!pzL||l.l==pzL).flatMap(l=>l.s.flatMap(s=>s[1]).filter(p=>p[3]).map(p=>({j:p[3].replace(/[{}]/g,''),r:p[4],a:p[5],sub:`Pola: ${p[0]} (${l.l})`})));
  return susun(`Susun Bunpo${L}`,()=>sentItems(shuf(ex).slice(0,N()+5),ex.map(x=>x.j)),puzzle)}
 if(m=='kaiwa'){const ln=KW.flatMap(d=>d[2].map(l=>({j:l[1],r:l[2],a:l[3],sub:`${d[1]} · ${l[0]}`})));
  return susun('Susun Kaiwa',()=>sentItems(shuf(ln).slice(0,N()+5),ln.map(x=>x.j)),puzzle)}
 if(m=='bun')return susun('Susun Bun',()=>sentItems(shuf(BUN).slice(0,N()+5).map(b=>({j:b[1],r:b[2],a:b[3],sub:b[0]})),BUN.map(b=>b[1])),puzzle);
 quiz('Tebak teka-teki',[
 {q:'朝は4本足、昼は2本足、夜は3本足。なあに？',qr:'asa wa yon-hon ashi, hiru wa ni-hon ashi, yoru wa san-bon ashi. naa ni?',a:'にんげん',d:['いぬ','とり','くるま'],e:'Manusia (bayi merangkak, dewasa berjalan, tua bertongkat)'},
 {q:'パンはパンでも、食べられないパンは？',qr:'pan wa pan demo, taberarenai pan wa?',a:'フライパン',d:['あんパン','しょくパン','カレーパン'],e:'Wajan penggorengan'},
 {q:'上は大火事、下は大水。なあに？',qr:'ue wa ookaji, shita wa oomizu. naa ni?',a:'おふろ',d:['やま','うみ','がっこう'],e:'Bak mandi air panas'}],puzzle,3)}

/* ----- KATSUYŌ: penjelasan, aturan, daftar 500 kata kerja + kuis ----- */
let ktTab=ST.get('ktTab','Daftar'),ktG=ST.get('ktG',''),ktL=ST.get('ktL',''),ktQ='',ktF=ST.get('ktF',['masu','nai','te','ta']);
const KT_EXPL=`<div class="card"><b>Katsuyō (活用) vs Bunpō (文法)</b><p style="margin:6px 0 0"><b>Katsuyō</b> membahas <u>perubahan bentuk kata</u>, sedangkan <b>Bunpō</b> membahas <u>aturan menyusun kata menjadi kalimat</u> yang benar.</p></div>
<h3>1. Perbedaan utama</h3>
<div class="card"><b>活用 — Katsuyō · perubahan kata</b><p class="rj" style="margin:4px 0">Contoh kata dasar 飲む (nomu) — minum.</p>${[['飲みます','nomimasu','minum (sopan)'],['飲まない','nomanai','tidak minum'],['飲んで','nonde','bentuk -te'],['飲みたい','nomitai','ingin minum']].map(x=>`<div class="gp"><div><b>${x[0]}</b><span class="ro">${x[1]}</span></div><div>${x[2]}</div></div>`).join('')}</div>
<div class="card"><b>文法 — Bunpō · pola dan aturan kalimat</b><p class="rj" style="margin:4px 0">Contoh memakai kata kerja 飲む (nomu).</p>${[['水を飲みます。','mizu o nomimasu.','Minum air.'],['水を飲みたい。','mizu o nomitai.','Ingin minum air.'],['水を飲んでいます。','mizu o nonde imasu.','Sedang minum air.'],['水を飲んでもいい。','mizu o nonde mo ii.','Boleh minum air.']].map(bub).join('')}</div>
<h3>2. Contoh supaya lebih mudah dipahami</h3>
<div class="card"><b>KATSUYŌ — mengubah kata 食べる (taberu, makan)</b>${[['食べます','tabemasu','makan (sopan)'],['食べない','tabenai','tidak makan'],['食べて','tabete','bentuk -te'],['食べたい','tabetai','ingin makan']].map(x=>`<div class="gp"><div><b>${x[0]}</b><span class="ro">${x[1]}</span></div><div>${x[2]}</div></div>`).join('')}</div>
<div class="card"><b>BUNPŌ — memakai bentuk kata dalam pola</b>${[['～たい · ingin melakukan','寿司を食べたいです。','Sushi o tabetai desu.','Saya ingin makan sushi.'],['～ている · sedang melakukan','寿司を食べています。','Sushi o tabete imasu.','Saya sedang makan sushi.'],['～てもいい · boleh melakukan','寿司を食べてもいいですか。','Sushi o tabete mo ii desu ka.','Bolehkah saya makan sushi?']].map(x=>`<p style="margin:10px 0 0"><b>${x[0]}</b></p>${bub(x.slice(1))}`).join('')}</div>
<h3>3. Hubungan Katsuyō dan Bunpō</h3>
<div class="card"><p style="margin:0">Keduanya tidak terpisah sepenuhnya, tetapi saling berhubungan:</p><ol style="margin:8px 0 0;padding-left:20px;line-height:1.8"><li><b>Kata dasar:</b> 食べる (taberu) — makan</li><li><b>Katsuyō:</b> 食べる → 食べて (taberu → tabete)</li><li><b>Bunpō:</b> ～ている (-te iru) — pola untuk menyatakan sedang melakukan</li><li><b>Kalimat lengkap:</b> 食べています。<span class="ro">(tabete imasu)</span> — sedang makan</li></ol></div>
<h3>4. Mana yang dipelajari lebih dahulu?</h3>
<div class="card wrap"><table><tr><th>Urutan</th><th>Materi</th><th>Yang dipelajari</th></tr><tr><td>1</td><td>Kotoba (言葉)</td><td>Kosakata: nomu, taberu, iku</td></tr><tr><td>2</td><td>Katsuyō (活用)</td><td>Perubahan kata: nomu → nonde</td></tr><tr><td>3</td><td>Bunpō (文法)</td><td>Pola kalimat: ～ている, ～たい</td></tr><tr><td>4</td><td>Kaiwa (会話)</td><td>Praktik percakapan sehari-hari</td></tr></table></div>
<div class="card"><b>Kesimpulan</b><ul style="margin:6px 0 0;padding-left:20px;line-height:1.8"><li><b>Kotoba</b> = kata atau kosakata yang kamu pelajari.</li><li><b>Katsuyō</b> = bagaimana bentuk kata itu berubah.</li><li><b>Bunpō</b> = bagaimana kata dan bentuknya dipakai sesuai aturan kalimat.</li><li><b>Kaiwa</b> = bagaimana kamu memakai semuanya dalam percakapan.</li></ul><p class="rj" style="margin:8px 0 0">Dari N5 sampai N1, pelajari Katsuyō dan Bunpō bersamaan: saat mempelajari satu pola Bunpō, pelajari juga perubahan kata yang dibutuhkan untuk membentuk pola tersebut.</p></div>`;
const KT_RULE=[
 ['Kelompok 1: Godan (u-verb)','Akhiran berpindah baris vokal (a-i-u-e-o).',[['ます / たい','u → i + ます','書く → 書きます'],['ない','u → a + ない (う → わ)','書く → 書かない · 買う → 買わない'],['て / た','く→いて · ぐ→いで · す→して · う/つ/る→って · ぬ/ぶ/む→んで','書く → 書いて · 飲む → 飲んで · 行く → 行って (pengecualian)'],['Potensial','u → e + る','書く → 書ける'],['Ajakan','u → o + う','書く → 書こう'],['ば','u → e + ば','書く → 書けば'],['Perintah','u → e','書く → 書け'],['Pasif','u → a + れる','書く → 書かれる'],['Kausatif','u → a + せる','書く → 書かせる']]],
 ['Kelompok 2: Ichidan (ru-verb)','Berakhiran る dengan bunyi i/e sebelumnya. Cukup buang る.',[['ます / ない / て / た / たい','る → ます · ない · て · た · たい','食べる → 食べます · 食べない · 食べて'],['Potensial / Pasif','る → られる','食べる → 食べられる'],['Ajakan','る → よう','食べる → 食べよう'],['ば','る → れば','食べる → 食べれば'],['Perintah','る → ろ','食べる → 食べろ'],['Kausatif','る → させる','食べる → 食べさせる']]],
 ['Kelompok 3: Tidak beraturan','Hanya する dan 来る (くる), termasuk kata benda + する (勉強する). Dihafalkan.',[['する','します · しない · して · した · できる · しよう · すれば · しろ · される · させる','勉強する → 勉強します'],['来る','きます · こない · きて · きた · こられる · こよう · くれば · こい · こさせる','来る → 来ます (きます)']]]];
function katsuyo(){
 const tabs=['Penjelasan','Aturan','Daftar'];if(!tabs.includes(ktTab))ktTab='Daftar';
 const P=KV.filter(v=>(!ktG||kgroup(v)==ktG)&&(!ktL||v.l==ktL)&&(!ktQ||(v.j+' '+v.k+' '+v.r+' '+v.a).toLowerCase().includes(ktQ)));
 let body='';
 if(ktTab=='Penjelasan')body=KT_EXPL;
 else if(ktTab=='Aturan'){const ex=['飲む','食べる','する','来る'].map(j=>V.find(v=>v.j==j)).filter(Boolean);
  body=KT_RULE.map(([t,d,r])=>`<h3>${t}</h3><div class="card"><p class="rj" style="margin:0 0 6px">${d}</p>${r.map(x=>`<div class="gp"><div><b>${x[0]}</b></div><div>${x[1]}<div class="rj">${x[2]}</div></div></div>`).join('')}</div>`).join('')
  +`<h3>Tabel 15 bentuk</h3><div class="card wrap"><table><tr><th>Bentuk</th>${ex.map(v=>`<th>${v.j}</th>`).join('')}</tr>${KF.map(f=>`<tr><td>${f[1]}<small>${f[2]}</small></td>${ex.map(v=>{const x=vForms(v).find(y=>y.id==f[0]);return`<td>${x?x.jj:'—'}${x&&x.jj!=x.kana?`<small>${x.kana}</small>`:''}${x?`<small class="ro">${rom(x.kana)}</small>`:''}</td>`}).join('')}</tr>`).join('')}</table></div>`}
 else body=`<input type="search" id="kts" placeholder="Cari kata kerja (kanji, kana, romaji, arti)..." value="${ktQ.replace(/"/g,'&quot;')}"><div class="row2"><select id="ktg"><option value="">Semua kelompok</option>${[1,2,3].map(g=>`<option value="${g}" ${g==ktG?'selected':''}>${GNAME[g]}</option>`).join('')}</select><select id="ktl"><option value="">Semua level</option>${['N5','Kerja','N4','N3','N2'].map(x=>`<option ${x==ktL?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="meta">${P.length} dari ${KV.length} kata kerja · ketuk untuk melihat 15 bentuknya</div><div class="card" id="ktlist">${P.slice(0,200).map(v=>`<button class="kvr" data-j="${v.j}"><span><b>${v.j}</b>${v.j!=v.k?` <span class="rj">${v.k}</span>`:''} <span class="ro rj">${v.r}</span><br><small>${v.a}</small></span><span class="rj" style="font-size:12px;text-align:right">${GNAME[kgroup(v)].split(' (')[0]}<br>${v.l}</span></button>`).join('')}${P.length>200?`<p class="rj">Menampilkan 200 pertama. Gunakan pencarian atau filter.</p>`:''}</div>
  <div class="kset"><span class="rj">Bentuk untuk kuis:</span>${KF.slice(1).map(f=>`<button class="tg${ktF.includes(f[0])?' on':''}" data-kf="${f[0]}">${f[1].replace('Bentuk ','')}</button>`).join('')}</div>`;
 view(`${hdr('Katsuyō · 活用')}<div class="tabs">${tabs.map(t=>`<button class="tg${t==ktTab?' on':''}" data-kt="${t}">${t=='Daftar'?`Daftar kata (${KV.length})`:t}</button>`).join('')}</div>${body}
 ${ktTab=='Penjelasan'?'':qbar('<button class="pb" id="k1">Ubah bentuk</button><button class="pb" id="k2">Arti bentuk</button><button class="pb" id="k3">Kelompok</button>')}`);
 onSpeak(app);
 app.querySelectorAll('[data-kt]').forEach(b=>b.onclick=()=>{ktTab=b.dataset.kt;ST.set('ktTab',ktTab);katsuyo()});
 if(ktTab=='Penjelasan')return;
 if(ktTab=='Daftar'){
  let tm;$('#kts').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{ktQ=e.target.value.trim().toLowerCase();katsuyo();const s=$('#kts');s.focus();s.setSelectionRange(s.value.length,s.value.length)},250)};
  $('#ktg').onchange=e=>{ktG=+e.target.value||'';ST.set('ktG',ktG);katsuyo()};$('#ktl').onchange=e=>{ktL=e.target.value;ST.set('ktL',ktL);katsuyo()};
  app.querySelectorAll('.kvr').forEach(b=>b.onclick=()=>katsuDetail(KV.find(v=>v.j==b.dataset.j),P));
  app.querySelectorAll('[data-kf]').forEach(b=>b.onclick=()=>{const id=b.dataset.kf;ktF=ktF.includes(id)?ktF.filter(x=>x!=id):[...ktF,id];if(!ktF.length)ktF=['masu'];ST.set('ktF',ktF);
   app.querySelectorAll('[data-kf]').forEach(x=>x.classList.toggle('on',ktF.includes(x.dataset.kf)))});
 }
 const pool=ktTab=='Daftar'?P:KV;
 document.querySelectorAll('#k1,#k2,#k3').forEach(b=>b.disabled=pool.length<4);
 const opt=x=>`${x.jj}${x.jj!=x.kana?`<small>${x.kana}</small>`:''}<small class="ro">${rom(x.kana)}</small>`;
 const pick=()=>shuf(pool).slice(0,QN());
 const nm=m=>`Katsuyō${ktL?' '+ktL:''}${ktG?' '+GNAME[ktG].split(' (')[0]:''}: ${m}`;
 $('#k1').onclick=()=>quiz(nm('ubah bentuk'),()=>pick().map(v=>{const F=vForms(v),cand=F.filter(x=>ktF.includes(x.id)),f=cand.length?shuf(cand)[0]:F[1];
  const others=shuf(KV.filter(x=>x!==v)).slice(0,3).map(w=>vForms(w).find(x=>x.id==f.id)).filter(Boolean);
  return{q:`${f.lab}<br><span style="font-size:15px;font-weight:400">dari <b>${v.j}</b>${v.j!=v.k?` (${v.k})`:''} · ${v.a}</span>`,qr:rom(v.k),a:opt(f),d:[...F.filter(x=>x.id!=f.id&&x.kana!=f.kana).map(opt),...others.map(opt)],nr:true,e:`Arti: ${f.arti}`}}),katsuyo);
 $('#k2').onclick=()=>quiz(nm('arti bentuk'),()=>pick().map(v=>{const F=vForms(v).filter(x=>x.id!='kamus'),cand=F.filter(x=>ktF.includes(x.id)),f=cand.length?shuf(cand)[0]:F[0];
  return{q:`${f.jj}${f.jj!=f.kana?`<br><small style="font-weight:400">${f.kana}</small>`:''}`,qr:rom(f.kana),say:f.kana,a:f.arti,d:F.filter(x=>x.arti!=f.arti).map(x=>x.arti),e:`${f.lab} dari ${v.j}`}}),katsuyo);
 $('#k3').onclick=()=>quiz(nm('kelompok'),()=>pick().map(v=>({q:`${v.j}${v.j!=v.k?`<br><small style="font-weight:400">${v.k}</small>`:''}`,qr:v.r,say:v.k,a:GNAME[kgroup(v)],d:Object.values(GNAME),e:v.a})),katsuyo)}
function katsuDetail(v,P){
 const F=vForms(v),i=P.indexOf(v);
 view(`${hdr(`${v.j} · ${v.a}`)}<div class="card"><b style="font-size:26px">${v.j}</b> ${v.j!=v.k?`<span class="rj">${v.k}</span>`:''} <span class="ro">${v.r}</span><div class="rj">${GNAME[kgroup(v)]} · ${v.l} · ${v.a}</div></div>
 <div class="card">${F.map(x=>`<div class="kfr"><div><span class="rj" style="font-size:12px">${x.lab} · ${x.ket}</span><div style="font-size:20px">${x.jj}${x.jj!=x.kana?` <span class="rj" style="font-size:14px">${x.kana}</span>`:''}</div><div class="ro" style="font-size:13px">${rom(x.kana)}</div><div>${x.arti}</div></div><button class="sp" data-s="${x.kana}">🔊</button></div>`).join('')}</div>
 <p class="rj">Arti tiap bentuk dibuat dari arti dasar kata. Bentuk pasif dan kausatif dalam bahasa Indonesia bisa berbeda-beda, jadi pahami fungsinya, bukan hafalan kata per kata.</p>
 <div class="row2"><button class="pb alt" id="kp" ${i>0?'':'disabled'}>← ${i>0?P[i-1].j:''}</button><button class="pb alt" id="kn" ${i>=0&&i<P.length-1?'':'disabled'}>${i>=0&&i<P.length-1?P[i+1].j:''} →</button></div>`,katsuyo);
 onSpeak(app);
 if(i>0)$('#kp').onclick=()=>katsuDetail(P[i-1],P);
 if(i>=0&&i<P.length-1)$('#kn').onclick=()=>katsuDetail(P[i+1],P)}
home();
</script></body></html>
