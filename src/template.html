details.dlg summary{cursor:pointer;padding:2px 0}details.dlg[open] summary{margin-bottom:6px}
/* ===== gaya Duolingo: tombol 3D, animasi, layar kuis ===== */
:root{--ok:#58cc02;--blue:#1cb0f6;--gold:#ffc800;--orange:#ff9600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#58cc02;--no:#ff4b4b}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.07)}70%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}70%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1)}}
@keyframes tilein{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}
@keyframes flame{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes lmfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#app.pgin{animation:fadeIn .16s ease both}#app>.qz .qcard{animation:popIn .25s ease both}
.pb{border-radius:16px;font-weight:700;letter-spacing:.3px;border-width:2px;box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 60%,#000);transition:transform .08s,box-shadow .08s,filter .15s}
.pb:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ac) 60%,#000)}
.pb.alt{box-shadow:0 4px 0 var(--bd)}.pb.alt:active:not(:disabled){box-shadow:0 1px 0 var(--bd)}
.pb:disabled{box-shadow:none}
.qbar .pb{box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 60%,#000)}
.mc,.kt,.kb{border-width:2px;box-shadow:0 4px 0 var(--bd);transition:transform .08s,box-shadow .08s,border-color .15s}
.mc:active,.kt:active,.kb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.mc:hover,.kt:hover,.kb:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.mc .ic{display:inline-block;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.mc:hover .ic{transform:scale(1.18) rotate(-8deg)}
.tg{transition:transform .08s,background .15s}.tg:active{transform:scale(.95)}
/* layar kuis */
.qz{padding-bottom:120px}
.qhead{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:8;background:var(--bg);margin:-14px -14px 6px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px}
.qhead .rt{padding:4px 9px;font-size:12px}
.qx{border:0;background:none;color:var(--mut);font-size:24px;cursor:pointer;line-height:1;padding:4px}
.qsnd{border:0;background:none;font-size:18px;cursor:pointer;padding:2px}
.qprog{flex:1;height:16px;background:var(--bd);border-radius:99px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.6,1);position:relative;min-width:16px}
.qprog i::after{content:'';position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.qstreak{font-weight:800;color:var(--mut);min-width:34px;text-align:center;font-size:15px}.qstreak.hot{color:var(--orange);animation:flame .8s ease-in-out infinite}

.qlbl{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:4px 0 8px}
.qcard{border-width:2px;border-radius:18px}
.sp2{font-size:30px;width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000);margin-top:6px}

.qz.hard .qbody .ro{display:none}

/* susun */
.stk.pop{animation:tilein .18s ease}
.sline.okl .stk{border-color:var(--ok);animation:bounce .45s}.sline.nol{animation:shake .4s}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Trail path container */
.ppath{position:relative;width:100%;max-width:440px;margin:0 auto;box-sizing:border-box}

.trail-path{fill:none;stroke:#cbd5e1;stroke-width:4.5px;stroke-dasharray:8 8;stroke-linecap:round}
:root[data-theme="dark"] .trail-path{stroke:#2a3b5c}

/* Trail node & floating card */
.trail-node-wrap{position:absolute;transform:translate(-50%,-32px);z-index:3;display:flex;flex-direction:column;align-items:center;width:140px}
.trail-node{width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.2,1.4,.4,1),box-shadow .15s;background:#edf2f7;color:var(--fg);position:relative}
.trail-node:hover{transform:scale(1.08)}
.trail-node:active{transform:scale(0.92)}
.trail-node.done{background:#10b981;box-shadow:0 4px 14px rgba(16,185,129,.4)}
.trail-node.cur{background:var(--ac);box-shadow:0 0 0 10px rgba(226,6,19,.18),0 6px 18px rgba(226,6,19,.38);animation:pulseHalo 1.8s ease-in-out infinite}
.trail-node.lock{background:#e2e8f0;box-shadow:0 2px 6px rgba(0,0,0,.04);color:#64748b}

@keyframes pulseHalo{0%,100%{box-shadow:0 0 0 8px rgba(226,6,19,.16),0 4px 14px rgba(226,6,19,.35)}50%{box-shadow:0 0 0 14px rgba(226,6,19,.28),0 8px 22px rgba(226,6,19,.45)}}

.pico{width:28px;height:28px}
.plock-ic{font-size:22px;opacity:.7}
.pico-emoji{font-size:30px;line-height:1}

.trail-card.lock .trail-card-title{color:var(--mut)}

const KF=[

const KV=(()=>{const LVO=['N5','Kerja','N4','N3','N2'],seen=new Set();
 return V.map((v,i)=>({...v,i})).filter(v=>/^Kata kerja/.test(v.t)&&v.j[0]!='〜'&&!/[ ・]/.test(v.k)&&!seen.has(v.j)&&seen.add(v.j)&&katsu(v))
  .sort((a,b)=>LVO.indexOf(a.l)-LVO.indexOf(b.l)||a.i-b.i).slice(0,500)})();

/* ===== SKOR & PROGRES ===== */
function trackStat(ok){
 const s=ST.get('stats',{ans:0,ok:0,last:'',streak:0}),d=day(0);
 if(s.last!==d){s.streak=s.last===day(-1)?s.streak+1:1;s.last=d}
 s.ans++;if(ok)s.ok++;ST.set('stats',s)}
function track(ok,it,ops){
 trackStat(ok);
 const m=ST.get('miss',{}),key=it.q+'¦'+it.a;
 if(ok){if(m[key]&&--m[key].c<=0)delete m[key]}
 else{m[key]={it:{q:it.q,a:it.a,d:ops.filter(x=>x!==it.a),e:it.e||'',say:it.say||null,qr:qRom(it),nr:!!it.nr},c:Math.min(3,(m[key]?m[key].c:0)+1)};
  const ks=Object.keys(m);ks.slice(0,Math.max(0,ks.length-300)).forEach(k=>delete m[k])}
 ST.set('miss',m)}
function saveScore(title,s,n){const S=ST.get('scores',{}),p=Math.round(s/n*100),r=S[title]||{best:0,n:0};
 const nb=r.n>0&&p>r.best;r.best=Math.max(r.best,p);r.last=p;r.n++;r.date=day(0);S[title]=r;ST.set('scores',S);return{nb,best:r.best}}
function streakNow(s){return s&&(s.last===day(0)||s.last===day(-1))?s.streak:0}
function prog(){
 const s=ST.get('stats',{ans:0,ok:0,last:'',streak:0}),S=ST.get('scores',{}),m=ST.get('miss',{}),mk=Object.keys(m);
 const rows=Object.entries(S).sort((a,b)=>b[1].date.localeCompare(a[1].date));
 view(`<div class="top"><img class="tlogo" src="__LOGO__" alt=""><h2>Progres</h2>${rtBtn()}</div><div class="card stats"><div><b>🔥 ${streakNow(s)}</b><small>hari berturut-turut</small></div><div><b>⚡ ${s.xp||0}</b><small>total XP</small></div><div><b>${s.ans}</b><small>soal dijawab</small></div><div><b>${s.ans?Math.round(s.ok/s.ans*100):0}%</b><small>jawaban benar</small></div></div>
 ${mk.length?`<button class="pb" id="rv">Ulangi soal yang salah (${mk.length})</button>`:'<p class="sub">Belum ada soal yang salah untuk diulang.</p>'}
 <h3>Riwayat kuis</h3>${rows.length?`<div class="card wrap"><table><tr><th>Kuis</th><th>Terbaik</th><th>Terakhir</th><th>Main</th><th>Tanggal</th></tr>${rows.map(([t,r])=>`<tr><td>${t}</td><td>${r.best}%</td><td>${r.last}%</td><td>${r.n}×</td><td>${r.date}</td></tr>`).join('')}</table></div>`:'<p class="sub">Belum ada kuis yang dimainkan.</p>'}
 <h3>Jalur belajar (Beranda)</h3><div class="card">${PLV.map(([L,lab])=>{const PL=pathLevel(L);if(!PL.count)return'';const d=PL.seq.filter(l=>pDone(PG(),l.id)).length;return`<div class="lvp"><b>${L}</b><div><div class="pbar"><i style="width:${d/PL.count*100}%"></i></div><small class="rj">${lab}</small></div><span class="rj">${d}/${PL.count}</span></div>`}).join('')}</div>
 <h3>Pengaturan</h3><div class="card"><button class="tg${sfxOn?' on':''}" id="psfx">Suara efek: ${sfxOn?'ON':'OFF'}</button><button class="tg${auto?' on':''}" id="pauto">Suara otomatis di kuis: ${auto?'ON':'OFF'}</button></div>
 <p class="rj">Progres disimpan di browser perangkat ini.</p><button class="pb alt" id="rs">Hapus semua progres</button>${navHtml('progres')}`);
 $('#psfx').onclick=()=>{sfxOn=!sfxOn;ST.set('sfx',sfxOn);prog()};$('#pauto').onclick=()=>{auto=!auto;ST.set('auto',auto);prog()};
 if(mk.length)$('#rv').onclick=()=>quiz('Ulangi yang salah',()=>{const c=ST.get('miss',{});return Object.values(c).map(x=>x.it)},prog);
 $('#rs').onclick=()=>{ask('Hapus semua skor, riwayat, daftar soal salah, dan kemajuan jalur belajar?',()=>{['stats','scores','miss','path'].forEach(ST.del);prog()},'Hapus')}}



/* ===== QUIZ ENGINE (gaya Duolingo) ===== */
// items: array soal, atau fungsi yang membuat soal baru setiap kali kuis dimulai

const optHtml=(o,it)=>o+(it.orom&&it.orom[o]?`<small class="ro">${it.orom[o]}</small>`:!it.nr&&isKana(o)?`<small class="ro">${romOpt(o)}</small>`:'');

/* ----- tingkat kesulitan (berlaku untuk semua kuis, disimpan) ----- */
const QDIFF={
 mudah:{lab:'Mudah',opts:3,extra:1,timer:0,ro:true,xp:5,trace:true,hint:1},
 sedang:{lab:'Sedang',opts:4,extra:3,timer:0,ro:true,xp:10,trace:false,hint:3},

let qd=ST.get('qd','sedang');const QDf=()=>QDIFF[qd]||QDIFF.sedang;

/* ----- suara efek (bisa dimatikan) ----- */
let sfxOn=ST.get('sfx',true),AC=null;
function tone(f,d,t=0,type='sine'){if(!sfxOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const now=AC.currentTime+t,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(g).connect(AC.destination);o.start(now);o.stop(now+d+.05)}catch(e){}}
const sfx={ok:()=>{tone(660,.12);tone(990,.2,.09)},no:()=>{tone(200,.28,0,'triangle')},tap:()=>tone(520,.05),done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,i*.12))};
const PRAISE=['Benar!','Hebat!','Mantap!','Luar biasa!','Keren!','すごい！','よくできました！','いいね！'];

/* ----- kerangka layar kuis: tombol keluar, progress bar, streak, timer, panel hasil ----- */
let QT=null;
function qShell(o,body,foot=true){
 return`<div class="qz${QDf().ro?'':' hard'}"><div class="qhead"><button class="qx" aria-label="Keluar dari kuis">✕</button><div class="qprog" role="progressbar" aria-valuenow="${o.i}" aria-valuemax="${o.n}"><i style="width:${o.i/o.n*100}%"></i></div><span class="qstreak${o.st>=3?' hot':''}" title="Jawaban benar berturut-turut">🔥${o.st}</span><button class="qsnd" aria-label="Suara efek">${sfxOn?'🔔':'🔕'}</button>${rtBtn()}</div>
 ${QDf().timer?`<div class="qtimer"><i></i></div>`:''}<div class="qtitle">${o.title} · ${o.i+1}/${o.n} · <span class="dtag ${qd}">${QDf().lab}</span></div><div class="qbody">${body}</div>
 ${foot?`<div class="qfoot"><div class="in"><button class="pb alt pass" id="qpass">Lewati</button><button class="pb" id="qchk" disabled>Periksa</button></div></div>`:''}<div class="sheet" id="sheet" role="status" aria-live="polite"></div></div>`}
// pasang tombol keluar & suara; jalankan timer tingkat Sulit
function qWire(back,sec,onTime){
 $('.qx').onclick=()=>{ask('Keluar dari kuis? Hasil kuis ini tidak disimpan.',back,'Keluar')};
 $('.qsnd').onclick=e=>{sfxOn=!sfxOn;ST.set('sfx',sfxOn);e.target.textContent=sfxOn?'🔔':'🔕'};
 if(sec&&$('.qtimer i')){const b=$('.qtimer i');b.style.transition='none';b.style.width='100%';b.getBoundingClientRect();b.style.transition=`width ${sec}s linear`;b.style.width='0%';
  clearTimeout(QT);QT=setTimeout(onTime,sec*1000)}}
function qStop(){clearTimeout(QT);const b=$('.qtimer i');if(b){b.style.width=getComputedStyle(b).width;b.style.transition='none'}}
// panel hasil yang naik dari bawah (hijau = benar, merah = salah/dilewati)
function qSheet(ok,head,html,next){
 const sh=$('#sheet'),f=$('.qfoot');if(f)f.classList.add('gone');
 sh.className='sheet '+(ok?'ok':'no');
 sh.innerHTML=`<div class="in"><h3>${ok?'🎉':'😕'} ${head}</h3><div class="det">${html}</div><button class="pb" id="qnext">Lanjut</button></div>`;
 sh.getBoundingClientRect();setTimeout(()=>sh.classList.add('show'),20);
 $('#qnext').onclick=next;window.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();next()}};setTimeout(()=>$('#qnext')&&$('#qnext').focus(),350)}
const qLine=(lab,v,cls='')=>v?`<div class="dl ${cls}"><span class="lb">${lab}</span>${v}</div>`:'';
function addXp(x){const s=ST.get('stats',{ans:0,ok:0,last:'',streak:0});s.xp=(s.xp||0)+x;ST.set('stats',s)}
function confetti(){const C=['#58cc02','#1cb0f6','#ff9600','#ff4b4b','#ce82ff','#ffc800'];
 for(let k=0;k<70;k++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=C[k%C.length];
  e.style.animationDuration=1.6+Math.random()*1.6+'s';e.style.animationDelay=Math.random()*.4+'s';e.style.transform=`rotate(${Math.random()*360}deg)`;document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}}
function countUp(el,to){const t0=performance.now(),d=900;const f=t=>{const p=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1&&el.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f);setTimeout(()=>{if(el.isConnected)el.textContent=to},d+80)}
// layar selesai: XP, akurasi, waktu, confetti
function quizDone(o){
 const r=saveScore(o.title,o.s,o.n),acc=Math.round(o.s/o.n*100),sec=Math.round((Date.now()-o.t0)/1000),tm=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
 addXp(o.xp);
 const msg=acc==100?'Sempurna! 完璧！':acc>=80?'Hebat sekali!':acc>=50?'Bagus, terus berlatih!':'Jangan menyerah, coba lagi!';
 view(`<div class="done"><div class="tro">${acc==100?'🏆':acc>=80?'🎉':acc>=50?'👍':'💪'}</div><h2>${msg}</h2><p class="rj">${o.title} · tingkat ${QDf().lab}${r.nb?' · 🏆 Rekor baru!':''}</p>
 <div class="dstats"><div class="dstat xp"><b>Total XP</b><span id="cxp">0</span></div><div class="dstat ac"><b>Akurasi</b><span>${acc}%</span></div><div class="dstat tm"><b>Waktu</b><span>${tm}</span></div></div>
 <p class="rj">${o.s} dari ${o.n} benar · streak terbaik 🔥${o.bs||0}</p><button class="pb" id="again">Ulangi</button><button class="pb alt" id="fin">Selesai</button><button class="pb alt" id="sc">Lihat skor & progres</button></div>`);
 countUp($('#cxp'),o.xp);sfx.done();if(acc>=50)confetti();
 $('#again').onclick=o.again;$('#fin').onclick=o.back;$('#sc').onclick=prog}

/* ===== RUNNER KUIS: semua jenis soal dalam satu alur (pilihan, susun, ketik, bicara, menulis) =====
   Item: {kind:'choice'|'susun'|'type'|'speak'|'write', ...}  — lihat renderer masing-masing di bawah. */
const pickPraise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
function runQuiz(title,makeItems,back,onDone){
 const D=QDf(),q=makeItems(),t0=Date.now();
 if(!q.length){view(`${hdr(title)}<p class="sub">Tidak ada soal untuk pengaturan ini. Coba pilih mode atau filter lain.</p>`,back);return}
 let i=0,s=0,st=0,bs=0,xp=0;
 const show=()=>{
  if(i>=q.length){if(onDone)onDone({s,n:q.length});return quizDone({title,s,n:q.length,bs,xp,t0,again:()=>runQuiz(title,makeItems,back,onDone),back})}
  const it=q[i],R=RENDER[it.kind];it._redo=show;
  view(qShell({title,i,n:q.length,st},R.body(it),it.kind!='write'),back);
  if(it.say&&$('#sp')){$('#sp').onclick=()=>speak(it.say);if((auto||it.listen)&&it.kind!='speak')speak(it.say)}
  const fin=(ok,head,det,opt={})=>{qStop();if(it.onRes)it.onRes(ok);
   if(ok){s++;st++;bs=Math.max(bs,st);xp+=D.xp;sfx.ok()}else{st=0;sfx.no()}
   if(!opt.tracked)trackStat(ok);
   const pb=$('.qprog i');if(pb)pb.style.width=(i+1)/q.length*100+'%';const sk=$('.qstreak');if(sk){sk.textContent='🔥'+st;sk.classList.toggle('hot',st>=3)}
   const go=()=>{i++;show()};
   if(opt.noSheet)return go();
   qSheet(ok,head||(ok?pickPraise():'Kurang tepat'),det,go);
   const sa=it.sayAfter||it.say;if($('#sp3')&&sa)$('#sp3').onclick=()=>speak(sa)};
  R.wire(it,fin,D);
  const sec=it.kind=='choice'?D.timer:(it.kind=='susun'||it.kind=='type')?D.timer*2:0;
  qWire(back,sec,()=>it._to&&it._to())};
 show()}
// rincian di panel hasil
const sayBtn=it=>(it.sayAfter||it.say)?' <button class="sp" id="sp3" aria-label="Putar suara">🔊</button>':'';
const detail=(it,ok,ansHtml,extra='')=>(ok?'':qLine('Jawaban benar',`<b class="ans">${ansHtml}</b>${sayBtn(it)}`))+(ok&&ansHtml&&it.kind!='choice'?qLine('Jawaban',`<b class="ans">${ansHtml}</b>${sayBtn(it)}`):'')
 +extra+qLine('Arti',it.mean)+qLine('Arti kalimat soal',it.qa)+(it.e?`<div class="dl">${it.e}</div>`:'');
const qCard=(it,showQ=true)=>`<div class="qlbl">${it.lbl||'Pilih jawaban yang benar'}</div><div class="card qcard">${showQ&&it.q?`<div class="qq">${it.q}</div>`:''}${showQ&&qRom(it)?`<div class="ro qr">${qRom(it)}</div>`:''}${it.say?`<div style="text-align:center"><button class="sp sp2${it.listen?' big':''}" id="sp" aria-label="Putar suara">🔊</button></div>`:''}</div>`;

const RENDER={
 // ----- pilihan ganda -----
 choice:{body:it=>{it._ops=shuf([it.a,...shuf([...new Set(it.d||[])].filter(x=>x!==it.a)).slice(0,QDf().opts-1)]);
   return qCard(it,!it.listen)+`<div class="opts">${it._ops.map((o,k)=>`<button class="opt" data-k="${k}"><span class="okey">${k+1}</span><span class="otx">${optHtml(o,it)}</span></button>`).join('')}</div>`},
  wire:(it,fin)=>{const ops=it._ops,btns=[...document.querySelectorAll('.opt')];let sel=null,done=false;
   const choose=k=>{if(done)return;sel=k;sfx.tap();btns.forEach(b=>b.classList.toggle('sel',+b.dataset.k===k));$('#qchk').disabled=false};
   const answer=k=>{if(done)return;done=true;const pick=k==null?null:ops[k],ok=pick===it.a;
    btns.forEach(b=>{b.disabled=true;b.classList.remove('sel');if(ops[b.dataset.k]===it.a)b.classList.add('ok')});
    if(k!=null&&!ok)btns[k].classList.add('no');
    track(ok,it,ops);
    const am=it.om&&it.om[it.a]&&it.om[it.a]!==strip(it.q)?it.om[it.a]:'';
    fin(ok,ok?null:k==null?'Dilewati':'Kurang tepat',detail(it,ok,optHtml(it.a,it),qLine('Arti jawaban',am)+(!ok&&pick&&it.om&&it.om[pick]?qLine('Pilihanmu artinya',it.om[pick],'bad'):'')),{tracked:true})};
   btns.forEach(b=>b.onclick=()=>choose(+b.dataset.k));$('#qchk').onclick=()=>answer(sel);$('#qpass').onclick=()=>answer(null);it._to=()=>answer(null);
   window.onkeydown=e=>{const n=+e.key;if(n>=1&&n<=ops.length)choose(n-1);else if(e.key=='Enter'&&sel!=null){e.preventDefault();answer(sel)}}}},
 // ----- susun ubin -----
 susun:{body:it=>{const ex=(it.extra||[]).slice(0,QDf().extra);it._bank=shuf([...it.tokens,...ex].map((t,x)=>({t,x,r:it.tr?it.tr[x]:''})));
   return`<div class="qlbl">${it.lbl||'Susun jawabannya'}</div><div class="card qcard"><div class="qq" style="font-size:21px">${it.q}</div>${it.sub?`<div class="rj" style="text-align:center">${it.sub}</div>`:''}</div><div class="sline" id="sl"></div><div class="sbank" id="sb"></div>`},
  wire:(it,fin)=>{const bank=it._bank;let pick=[],done=false,last=null;
   const chip=(o,used)=>`<button class="stk${used?' used':''}${o===last?' pop':''}" data-x="${o.x}">${o.t}${it.kana?`<small class="ro">${romChar(o.t)}</small>`:o.r?`<small class="ro">${o.r}</small>`:''}</button>`;
   const draw=()=>{$('#sl').innerHTML=pick.map(o=>chip(o,false)).join('')||'<span class="rj">Ketuk ubin di bawah untuk menyusun jawaban</span>';
    $('#sb').innerHTML=bank.map(o=>chip(o,pick.includes(o))).join('');last=null;$('#qchk').disabled=!pick.length||done;if(done)return;
    $('#sl').querySelectorAll('.stk').forEach(b=>b.onclick=()=>{sfx.tap();pick=pick.filter(o=>o.x!=b.dataset.x);draw()});
    $('#sb').querySelectorAll('.stk:not(.used)').forEach(b=>b.onclick=()=>{sfx.tap();last=bank.find(o=>o.x==b.dataset.x);pick.push(last);draw()})};
   const answer=pass=>{if(done)return;done=true;const ok=!pass&&pick.map(o=>o.t).join('')===it.tokens.join('');draw();$('#sl').classList.add(ok?'okl':'nol');
    fin(ok,ok?null:pass?'Dilewati':'Kurang tepat',detail(it,ok,it.ans));if(it.say)speak(it.say)};
   $('#qchk').onclick=()=>answer(false);$('#qpass').onclick=()=>answer(true);it._to=()=>answer(true);
   window.onkeydown=e=>{if(e.key=='Enter'&&pick.length){e.preventDefault();answer(false)}else if(e.key=='Backspace'&&pick.length){pick.pop();draw()}};draw()}},
 // ----- ketik jawaban -----
 type:{body:it=>qCard(it)+`<textarea id="tin" class="tin" rows="2" placeholder="${esc(it.ph||'Ketik jawabanmu…')}" autocomplete="off" autocapitalize="off" spellcheck="false" lang="${it.mode=='jp'?'ja':'id'}"${it.mode=='num'?' inputmode="numeric"':''} aria-label="Jawaban"></textarea>`,
  wire:(it,fin)=>{const ta=$('#tin');let done=false;setTimeout(()=>ta.focus(),200);
   ta.oninput=()=>{$('#qchk').disabled=!ta.value.trim()};
   const answer=pass=>{if(done)return;done=true;ta.disabled=true;const v=ta.value.trim(),r=pass?{ok:false}:it.mode=='num'?{ok:v.replace(/\D/g,'')===String(it.num)}:(it.mode=='jp'?checkJp(v,it):checkArti(v,it.ans));
    ta.classList.add(r.ok?'okt':'not');
    fin(r.ok,r.ok?(r.near?'Hampir benar!':null):pass?'Dilewati':'Kurang tepat',detail(it,r.ok,it.mode=='jp'?it.ans:esc(it.ans),(r.ok&&r.near?qLine('Perhatikan ejaannya',`<b class="ans">${it.mode=='jp'?it.ans:esc(it.ans)}</b>`):'')+(v&&!r.ok?qLine('Jawabanmu',esc(v),'bad'):'')));
    if(it.sayAfter)speak(it.sayAfter)};
   $('#qchk').onclick=()=>answer(false);$('#qpass').onclick=()=>answer(true);it._to=()=>answer(false);
   ta.onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();if(ta.value.trim())answer(false)}}}},
 // ----- bicara (pengenalan suara) -----
 speak:{body:it=>qCard(it)+`<div class="mic"><button class="micb" id="mic" aria-label="Mulai bicara">🎤</button><div class="rj" id="mst">Ketuk mikrofon, lalu ucapkan kalimat di atas</div></div>`,
  wire:(it,fin,D)=>{$('#qchk').style.display='none';let done=false,tries=0,rec=null;
   const thr={mudah:.5,sedang:.6,sulit:.75}[qd]||.6;
   const end=(ok,heard,pass)=>{if(done)return;done=true;try{rec&&rec.abort()}catch(e){}
    fin(ok,ok?null:pass?'Dilewati':'Kurang tepat',detail(it,ok,it.ans,heard?qLine('Terdengar',esc(heard),ok?'':'bad'):''))};
   $('#mic').onclick=()=>{if(done)return;try{rec=new SR();rec.lang='ja-JP';rec.interimResults=false;rec.maxAlternatives=5;
     rec.onstart=()=>{$('#mic').classList.add('rec');$('#mst').textContent='Mendengarkan… silakan bicara'};

/* ----- pemeriksaan jawaban ketik (toleran salah ketik) ----- */
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
 for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}
const simL=(a,b)=>{const L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:1};
const tnorm=s=>s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/["'“”‘’]/g,'').replace(/[^a-z0-9\s-]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim();
function checkArti(input,ans){const x=tnorm(input);if(!x)return{ok:false};
 const alts=[ans,...ans.split(/[\/;,]| atau /)].map(tnorm).filter(Boolean);let best=0;
 for(const a of alts){if(a===x)return{ok:true};best=Math.max(best,simL(a,x));
  // kalimat panjang: cukup jika sebagian besar kata penting muncul
  const aw=a.split(' ').filter(w=>w.length>2),xw=x.split(' ');
  if(aw.length>=3){const hit=aw.filter(w=>xw.some(y=>y===w||simL(w,y)>=.8)).length/aw.length;if(hit>=.75)return{ok:true,near:hit<1}}}
 return best>=.8?{ok:true,near:true}:{ok:false}}
const jstrip=s=>s.replace(/[\s。、！？!?「」『』.,…〜～・]/g,'');
const rnorm=s=>rnormIdx(s).map(x=>x.c).join('');
function checkJp(input,it){const x=jstrip(input);if(!x)return{ok:false};
 if(/[ぁ-ゖァ-ヺ一-龯]/.test(x)){const c=(it.accept||[]).map(jstrip).flatMap(a=>[a,toHira(a)]),xh=toHira(x);
  if(c.includes(x)||c.includes(xh))return{ok:true};if(it.exact)return{ok:false};const b=Math.max(0,...c.map(a=>simL(a,xh)));return b>=.85&&x.length>3?{ok:true,near:true}:{ok:false}}
 const xr=rnorm(x),rs=(it.roms||[]).map(rnorm).filter(Boolean);if(rs.includes(xr))return{ok:true};if(it.exact)return{ok:false};
 const b=Math.max(0,...rs.map(a=>simL(a,xr)));return b>=.88&&xr.length>5?{ok:true,near:true}:{ok:false}}
/* ----- pengenalan suara ----- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,SRok=!!SR;
function dice(a,b){if(a===b)return 1;if(a.length<2||b.length<2)return 0;const bg=s=>{const m=new Map();for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);m.set(g,(m.get(g)||0)+1)}return m};
 const A=bg(a),B=bg(b);let n=0;for(const[g,c]of A)n+=Math.min(c,B.get(g)||0);return 2*n/(a.length+b.length-2)}
function speechSim(heard,target){const h=toHira(jstrip(heard)),t=toHira(jstrip(target));if(!h||!t)return 0;if(h===t)return 1;
 if(t.length<=2)return h.includes(t)?1:0;return Math.max(dice(h,t),simL(h,t))}

// susun daftar soal: setiap entri dicoba dengan mode acak dari mode yang dipilih

 M.ketikA={lab:L.ketikA,gen:e=>({kind:'type',mode:c.num?'num':'arti',num:c.num&&c.num(e),lbl:c.lblKetikA||'Ketik artinya',q:c.jp(e),qr:qr(e),say:c.say(e),ans:c.a(e),ph:c.phA||'Ketik arti dalam bahasa Indonesia…',e:c.hideR?'':ans(e)})};
 if(c.roms!==false)M.ketikJ={lab:L.ketikJ,gen:e=>({kind:'type',mode:'jp',lbl:c.lblKetikJ||'Tulis dalam bahasa Jepang',q:c.qJp?c.qJp(e):c.a(e),qr:'',accept:acc(e),roms:c.roms?c.roms(e):[c.r(e)],exact:!!c.exact,ans:ans(e),sayAfter:c.say(e),mean:c.qJp?c.a(e):'',ph:'Ketik dengan kana atau romaji…'})};

/* ===== KUIS MENULIS =====
   item: {q (soal), qr (romaji soal), say (suara), chars:[huruf yang harus ditulis], ans (jawaban lengkap, html)}
   Dua mode (disimpan):
   - Bebas: tulis seluruh jawaban sekaligus di kanvas, lihat jawaban + panduan goresan, lalu nilai sendiri ✗/✓.
   - Cek otomatis: setiap goresan dicocokkan dengan data KanjiVG (posisi, arah, urutan), huruf per huruf. */
const NS=24,SVGNS='http://www.w3.org/2000/svg';
const smp=(()=>{const s=document.createElementNS(SVGNS,'svg');s.setAttribute('width','0');s.setAttribute('height','0');s.style.position='absolute';const p=document.createElementNS(SVGNS,'path');s.appendChild(p);document.body.appendChild(s);return p})();
const plen=a=>a.reduce((s,p,i)=>i?s+Math.hypot(p[0]-a[i-1][0],p[1]-a[i-1][1]):0,0);

 const d=[0];for(let i=1;i<a.length;i++)d.push(d[i-1]+Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]));

 for(let k=0;k<NS;k++){const t=L*k/(NS-1);while(j<d.length-2&&d[j+1]<t)j++;const g=d[j+1]-d[j]||1,f=Math.min(1,Math.max(0,(t-d[j])/g));o.push([a[j][0]+(a[j+1][0]-a[j][0])*f,a[j][1]+(a[j+1][1]-a[j][1])*f])}

const strokeCache={};
function expStroke(d){if(strokeCache[d])return strokeCache[d];smp.setAttribute('d',d);const L=smp.getTotalLength(),o=[];
 for(let k=0;k<NS;k++){const p=smp.getPointAtLength(L*k/(NS-1));o.push([p.x,p.y])}return strokeCache[d]={pts:o,len:L,d}}

 if(dot)return mean<20;
 const st=Math.hypot(u[0][0]-e.pts[0][0],u[0][1]-e.pts[0][1]),en=Math.hypot(u[NS-1][0]-e.pts[NS-1][0],u[NS-1][1]-e.pts[NS-1][1]);

const canWrite=s=>[...s].every(c=>STK[c]&&STK[c].length);

const strokeSvg=c=>{const s=STK[c]||[];return`<svg class="sgd" viewBox="0 0 109 109" aria-label="Urutan goresan ${c}">${s.map(d=>`<path d="${d}"/>`).join('')}${s.map((d,j)=>{const m=d.match(/^[Mm]\s*([\d.]+)[ ,]+([\d.]+)/);return m?`<text x="${(+m[1]-6).toFixed(1)}" y="${(+m[2]-2).toFixed(1)}">${j+1}</text>`:''}).join('')}</svg>`};
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

 <div class="kctl">${qd=='sulit'?'':`<button class="tg${QDf().trace?' on':''}" id="wt">✍️ Jiplak</button><button class="tg" id="wg">👁 Panduan goresan</button>`}<button class="tg" id="wc">🗑 Hapus</button><button class="tg" id="wp">⏭ Lewati</button></div>
 <div id="wact"><button class="pb" id="wshow">Lihat jawaban</button></div>`;

// ----- Mode cek otomatis: per goresan, huruf per huruf -----
function writeStrict(it,box,done){
 const ch=it.chars,E=ch.map(c=>(STK[c]||[]).map(expStroke)),total=E.reduce((a,x)=>a+x.length,0);
 let ci=0,si=0,miss=0,missHere=0,hints=0,hint=false,user=null,wrong=null,fin=false;

 <div class="kctl"><button class="tg" id="wh">💡 Petunjuk</button><button class="tg" id="wr">↺ Ulangi huruf</button><button class="tg" id="wg">Menyerah</button></div>
 <p class="rj" id="wst" style="text-align:center;margin:6px 0 0"></p><div id="fb"></div>`;
 const cv=$('#pad'),cx=cv.getContext('2d'),S=cv.width/109;
 const boxes=()=>{$('#wb').innerHTML=ch.length>1?ch.map((c,j)=>`<span class="${j<ci?'done':j==ci&&!fin?'cur':''}">${j<ci||fin?c:j==ci?'?':'·'}</span>`).join(''):'';
  $('#wst').textContent=fin?'':`Goresan ${si+1} dari ${E[ci].length}${ch.length>1?` · huruf ${ci+1} dari ${ch.length}`:''}${miss?` · salah ${miss}`:''}`};
 const line=(pts,col,w)=>{if(!pts||!pts.length)return;cx.strokeStyle=col;cx.lineWidth=w;cx.beginPath();pts.forEach((p,j)=>j?cx.lineTo(p[0]*S,p[1]*S):cx.moveTo(p[0]*S,p[1]*S));if(pts.length==1)cx.lineTo(pts[0][0]*S+.1,pts[0][1]*S);cx.stroke()};
 const path=(d,col,w)=>{cx.save();cx.scale(S,S);cx.strokeStyle=col;cx.lineWidth=w;cx.stroke(new Path2D(d));cx.restore()};
 const draw=()=>{cx.clearRect(0,0,cv.width,cv.height);cx.lineCap=cx.lineJoin='round';
  cx.save();cx.strokeStyle=cssv('--bd');cx.lineWidth=2;cx.setLineDash([8,8]);cx.beginPath();cx.moveTo(300,0);cx.lineTo(300,600);cx.moveTo(0,300);cx.lineTo(600,300);cx.stroke();cx.restore();
  const cur=E[ci]||[];
  if(fin)cur.forEach(e=>path(e.d,cssv('--fg'),4.5));
  else{if(hint&&cur[si])path(cur[si].d,cssv('--ac'),4);cur.slice(0,si).forEach(e=>path(e.d,cssv('--fg'),4.5))}
  line(wrong,cssv('--no'),14);line(user,cssv('--fg'),14);boxes()};
 const finish=gave=>{fin=true;cv.classList.add('off');
  const ok=!gave&&!hints&&miss<=Math.max(2,Math.round(total*.25));
  if(gave)ci=Math.min(ci,ch.length-1);draw();
  $('#fb').innerHTML=`<p>${ok?'✅ Benar':gave?'❌ Jawaban':'⚠️ Selesai'}${!gave&&!ok?` (salah ${miss} goresan${hints?', pakai petunjuk':''})`:''}: <b style="font-size:20px">${it.ans}</b></p><button class="pb" id="nx">Lanjut</button>`;
  document.querySelectorAll('#wh,#wr,#wg').forEach(b=>b.disabled=true);
  if(it.say)speak(it.say);$('#nx').onclick=()=>done(ok)};

 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*109,(e.clientY-r.top)/r.height*109]};
 cv.onpointerdown=e=>{if(fin)return;cv.setPointerCapture(e.pointerId);user=[pt(e)];draw()};
 cv.onpointermove=e=>{if(user){user.push(pt(e));draw()}};
 cv.onpointerup=cv.onpointercancel=()=>{if(!user||fin)return;const u=user;user=null;
  if(strokeOk(u,E[ci][si])){si++;missHere=0;hint=false;
   if(si>=E[ci].length){ci++;si=0;if(ci>=ch.length){finish(false);return}if(skipEmpty())return}}
  else{miss++;missHere++;wrong=u;if(missHere>=QDf().hint)hint=true;setTimeout(()=>{wrong=null;if(!fin)draw()},450)}
  draw()};
 $('#wh').onclick=()=>{hint=true;hints++;draw()};

 if(!skipEmpty())draw()}

/* ===== PEMUTAR URUTAN GORESAN (Kanji & Kana) =====
   o: {chars:[[path d...], ...] (satu kotak 109×109 per huruf), n:[[x,y]] posisi nomor (opsional), parts:[komponen KanjiVG] (opsional, untuk warna), label}
   Waktu animasi dihitung dari panjang goresan, jadi bisa dijeda, dilanjutkan, maju/mundur per goresan, dan diubah kecepatannya. */
const PCOL=['#1cb0f6','#ff9600','#58cc02','#ce82ff','#ff4b4b','#e0a800'];
const numPos=(s,dx=0)=>s.map(d=>{const m=d.match(/^[Mm]\s*([\d.]+)[ ,]+([\d.]+)/);return m?[+(+m[1]-6+dx).toFixed(1),+(+m[2]-2).toFixed(1)]:[dx,0]});
let spd=ST.get('spd',1);
function strokePlayer(host,o){
 const S=o.chars.flatMap((s,c)=>s.map(d=>({d,dx:c*109}))),N=S.length,W=109*o.chars.length;
 if(!N){host.innerHTML='<p class="rj" style="text-align:center">Data urutan goresan tidak tersedia.</p>';return null}
 const nums=o.n&&o.n.length==N?o.n:o.chars.flatMap((s,c)=>numPos(s,c*109)),pc=[];
 (o.parts||[]).forEach((p,i)=>p[4].forEach(j=>pc[j]=PCOL[i%PCOL.length]));
 const pth=S.map(x=>`<path d="${x.d}"${x.dx?` transform="translate(${x.dx} 0)"`:''}/>`).join('');
 const grid=o.chars.map((_,c)=>`<line x1="${c*109+54.5}" y1="2" x2="${c*109+54.5}" y2="107"/><line x1="${c*109+2}" y1="54.5" x2="${c*109+107}" y2="54.5"/>${c?`<line class="sep" x1="${c*109}" y1="0" x2="${c*109}" y2="109"/>`:''}`).join('');
 host.innerHTML=`<div class="kv${o.chars.length>1?' wide':''}"><svg viewBox="0 0 ${W} 109" role="img" aria-label="${esc(o.label||'Urutan goresan')}"><g class="gl">${grid}</g><g class="ghost">${pth}</g><g class="ink">${pth}</g><g class="num">${nums.map((p,j)=>`<text x="${p[0]}" y="${p[1]}">${j+1}</text>`).join('')}</g></svg></div>
 <div class="spbar" aria-hidden="true"><i></i></div><div class="scnt" aria-live="polite"></div>
 <div class="kctl"><button class="tg" data-a="restart" aria-label="Ulang dari awal" title="Ulang dari awal">⏮</button><button class="tg" data-a="prev" aria-label="Goresan sebelumnya" title="Goresan sebelumnya">◀</button><button class="tg on splay" data-a="toggle" aria-label="Putar">▶</button><button class="tg" data-a="next" aria-label="Goresan berikutnya" title="Goresan berikutnya">▶|</button></div>
 <div class="kctl"><span class="rj">Kecepatan</span>${[.5,1,2].map(v=>`<button class="tg${v==spd?' on':''}" data-sp="${v}" aria-pressed="${v==spd}">${v}×</button>`).join('')}<button class="tg on" data-a="num" aria-pressed="true">Nomor</button>${o.parts&&o.parts.length?'<button class="tg" data-a="col" aria-pressed="false">Warna komponen</button>':''}</div>`;
 const ink=[...host.querySelectorAll('.ink path')],len=ink.map(p=>p.getTotalLength()+1);
 const dur=len.map(l=>Math.max(320,l*11)),GAP=220,st=[];let T=0;dur.forEach((d,j)=>{st[j]=T;T+=d+GAP});
 const endAt=c=>c?st[c-1]+dur[c-1]:0;
 let e=0,playing=false,tm=null,last=0,col=false;
 const done=()=>dur.filter((d,j)=>e>=st[j]+d).length;
 const draw=()=>{if(!host.contains(ink[0])){playing=false;return}let cur=-1;
  ink.forEach((p,j)=>{const f=Math.min(1,Math.max(0,(e-st[j])/dur[j]));p.style.strokeDasharray=len[j];p.style.strokeDashoffset=len[j]*(1-f);if(f>0)cur=j;p.style.stroke=col&&pc[j]?pc[j]:''});
  ink.forEach((p,j)=>p.classList.toggle('cur',j==cur&&!(col&&pc[j])&&e<T));
  const n=cur+1;host.querySelector('.scnt').textContent=`${n} / ${N} goresan`;host.querySelector('.spbar i').style.width=Math.min(100,e/(T-GAP)*100)+'%';
  const b=host.querySelector('.splay');b.textContent=playing?'⏸':'▶';b.setAttribute('aria-label',playing?'Jeda':'Putar')};
 const tick=()=>{if(!host.isConnected||!host.contains(ink[0])){playing=false;return}const now=performance.now();e=Math.min(T,e+(now-last)*spd);last=now;
  if(e>=T){e=T;playing=false}draw();if(playing)tm=setTimeout(tick,30)};
 const P={
  play(){if(playing)return;if(e>=T-GAP)e=0;playing=true;last=performance.now();clearTimeout(tm);tick()},
  pause(){playing=false;clearTimeout(tm);draw()},

  restart(){P.pause();e=0;P.play()},
  next(){P.pause();e=endAt(Math.min(N,done()+1));draw()},
  prev(){P.pause();const c=done();e=e>endAt(c)?endAt(c):endAt(Math.max(0,c-1));draw()},
  speed(v){spd=v;ST.set('spd',v);host.querySelectorAll('[data-sp]').forEach(b=>{b.classList.toggle('on',+b.dataset.sp==v);b.setAttribute('aria-pressed',+b.dataset.sp==v)})},
  state:()=>({step:done(),total:N,playing,speed:spd})};
 host.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
  if(a=='num'||a=='col'){const on=b.classList.toggle('on');b.setAttribute('aria-pressed',on);if(a=='num')host.querySelector('.num').style.display=on?'':'none';else{col=on;draw()}return}
  P[a]()});
 host.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>P.speed(+b.dataset.sp));
 draw();setTimeout(()=>P.play(),300);host._player=P;return P}

 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};

function compInfo(p){const e=p[0],o=p[1],kj=KJM[e]||KJM[o],r=RADN[e]||RADN[o];

const kjPhon=k=>{const out=new Set(),w=ps=>ps.forEach(p=>{if(p[3].includes('p')&&p[0]!='?')out.add(p[0]);w(p[5])});w(k.p||[]);return out};

const kjFam=e=>{if(!KFAM)famBuild();return KFAM.get(e)||[]};

const LDIR={left:[-30,0],right:[30,0],top:[0,-30],bottom:[0,30],tare:[-24,-24],tarec:[24,24],nyo:[-24,24],nyoc:[24,-24],kamae:'out',kamaec:'in',middle:'in'};
function legoOff(p,i,ps){let d=LDIR[p[2]];if(!d)d=ps.some(x=>/^kamae$/.test(x[2]))?'in':[[-30,0],[30,0],[0,-30],[0,30]][i%4];
 return d=='out'?'scale(1.5)':d=='in'?'scale(.35)':`translate(${d[0]}px,${d[1]}px)`}

 const I=ps.map(compInfo);
 const eq=ps.map((p,i)=>`<span class="leq" style="--c:${PCOL[i%PCOL.length]}">${partSvg(k,p,PCOL[i%PCOL.length])}</span>`).join('<b class="lop">+</b>')+`<b class="lop">=</b><span class="leq fin"><b>${k.k}</b></span>`;
 host.innerHTML=`<div class="kv"><svg class="lego" viewBox="-22 -22 153 153" role="img" aria-label="Komponen ${k.k}">${ps.map((p,i)=>`<g class="lg" style="--c:${PCOL[i%PCOL.length]}">${p[4].map(j=>`<path d="${k.s[j]}"/>`).join('')}</g>`).join('')}</svg></div>

 <div class="kctl"><button class="tg on" data-l="go">▶ Rakit ulang</button><button class="tg" data-l="split" aria-pressed="false">↔ Pisahkan</button></div>${dl>tl?`<div class="kctl"><span class="rj">Komponen</span><button class="tg${kDeep?'':' on'}" data-dp="0" aria-pressed="${!kDeep}">Utama (${tl})</button><button class="tg${kDeep?' on':''}" data-dp="1" aria-pressed="${kDeep}">Rinci (${dl})</button></div>`:''}
 <div class="lcards">${ps.map((p,i)=>{const c=I[i],col=PCOL[i%PCOL.length],pk=c.kj||KJM[c.o];
  const role=[c.rad?'<span class="bdg r">Bushu (radikal)</span>':'',c.phon?'<span class="bdg p">Petunjuk bunyi</span>':'',!c.phon?'<span class="bdg m">Petunjuk makna</span>':''].join('');
  const snd=c.phon&&pk&&pk.on.length?`<div class="rj">Dibaca ${pk.on.map(x=>`${x} <span class="ro">(${rom(x)})</span>`).join(', ')}${pk.on.some(x=>k.on.includes(x))?` — <b>sama</b> dengan on'yomi ${k.k}`:''}</div>`:'';
  return`<div class="lcard" style="--c:${col}">${partSvg(k,p,col)}<div><b class="lce">${c.e=='?'?'(bagian)':c.e}</b>${c.o&&c.o!=c.e?` <span class="rj">bentuk dari ${c.o}</span>`:''}${c.name?` <span class="rj">${c.name} <span class="ro">(${rom(c.name)})</span></span>`:''}
   <div>${c.mean?c.mean:'<span class="rj">komponen bentuk</span>'}</div>${role}${snd}${p[6]?`<div class="rj">bagian dari <b>${p[6]}</b>${KJM[p[6]]?` (${KJM[p[6]].a})`:''}</div>`:''}${c.subs.length>1?`<div class="rj">terdiri dari ${c.subs.join(' + ')}</div>`:''}${pk&&pk!==k?`<button class="tg lnk" data-k="${pk.k}">Lihat kanji ${pk.k} →</button>`:''}</div></div>`}).join('')}</div>`;
 const G=[...host.querySelectorAll('.lg')],svg=host.querySelector('.lego');let run=0;
 const place=(split,anim)=>G.forEach((g,i)=>{g.style.transition=anim?'transform .65s cubic-bezier(.2,1.5,.4,1),opacity .3s':'none';g.style.transform=split?legoOff(ps[i],i,ps):'none';g.style.opacity=1});
 const go=()=>{const id=++run;svg.classList.remove('done');G.forEach((g,i)=>{g.style.transition='none';g.style.transform=legoOff(ps[i],i,ps);g.style.opacity=0});svg.getBoundingClientRect();
  G.forEach((g,i)=>setTimeout(()=>{if(id!=run||!g.isConnected)return;g.style.transition='transform .65s cubic-bezier(.2,1.5,.4,1),opacity .3s';g.style.transform='none';g.style.opacity=1;sfx.tap()},350+i*600));
  setTimeout(()=>{if(id==run&&svg.isConnected){svg.classList.add('done');sfx.ok()}},350+G.length*600+350)};
 host.querySelector('[data-l="go"]').onclick=()=>{const b=host.querySelector('[data-l="split"]');b.classList.remove('on');b.setAttribute('aria-pressed',false);go()};
 host.querySelector('[data-l="split"]').onclick=e=>{run++;const on=e.target.classList.toggle('on');e.target.setAttribute('aria-pressed',on);svg.classList.toggle('done',!on);place(on,true)};

 go()}

/* ----- keluarga kanji: kanji lain yang memakai komponen yang sama ----- */
function famHtml(k){
 const seen=new Set(),ps=[...(k.p||[]),...kjDeep(k)].filter(p=>p[0]!='?'&&!PSTR.has(p[0])&&!seen.has(p[0])&&seen.add(p[0]));if(!ps.length)return'';
 const row=(p,i)=>{const e=p[0],ph=p[3].includes('p'),L=(ph?kjPhFam(e):kjFam(e)).filter(x=>x!==k),self=KJM[e]&&KJM[e]!==k?[KJM[e]]:[];
  const all=[...self,...L.filter(x=>!self.includes(x))].slice(0,12);if(!all.length)return'';
  return`<div class="fam"><div class="rj"><span class="fdot" style="background:${PCOL[i%PCOL.length]}"></span><b>${e}</b> · ${ph?'keluarga bunyi (on\'yomi)':'kanji lain dengan komponen ini'}</div><div class="fgrid">${all.map(x=>`<button class="kt" data-k="${x.k}"><b>${x.k}</b><small>${ph?(x.on[0]||'–'):x.a}</small></button>`).join('')}</div></div>`};
 const h=ps.map((p,i)=>row(p,i)).join('');
 return h?`<h3>Keluarga kanji</h3><div class="card" id="fam">${h}</div>`:''}

 <div class="row2"><button class="pb alt" id="kp" ${i>0?'':'disabled'}>← ${i>0?L[i-1]:''}</button><button class="pb alt" id="kn" ${i<L.length-1?'':'disabled'}>${i<L.length-1?L[i+1]:''} →</button></div>

  tiles:v=>{const tk=kanaTok(v.k);return v.j[0]!='〜'&&!/[ ・]/.test(v.k)&&tk.length<=8?tk:null},kanaTiles:true,extra:(v,tk)=>kanaExtra(tk,/[ァ-ヺ]/.test(v.k)?KATA:HIRA),subSusun:v=>v.t};

/* ----- BUNPO: materi N5–N1, perbandingan pola, cara belajar ----- */
let bpL=ST.get('bpL','N5');
const bpRows=lv=>{const seen=new Set();return lv.s.flatMap(x=>x[1]).filter(r=>!seen.has(r[0])&&seen.add(r[0]))};
// kunci arti untuk menghindari pengecoh yang artinya mirip (mis. "Harus" vs "Harus (wajib)")
const bpKey=a=>a.toLowerCase().split(/[;/(]/)[0].replace(/[.…]/g,'').trim();
const bpSame=(a,b)=>{const x=bpKey(a),y=bpKey(b);return x==y||x.includes(y)||y.includes(x)};
const BP_CMP=[['～そうです vs ～ようです vs ～らしい',[['おいしそうです。','Oishisō desu.','Kelihatannya enak — berdasarkan penampilan.'],['おいしいようです。','Oishii yō desu.','Sepertinya enak — berdasarkan pengamatan atau bukti.'],['おいしいらしいです。','Oishii rashii desu.','Katanya enak / sepertinya enak — berdasarkan informasi atau kesan yang diperoleh.']]],
 ['～ために vs ～ように',[['日本へ行くために、お金を貯めています。','Nihon e iku tame ni, okane o tamete imasu.','Saya menabung untuk pergi ke Jepang — tujuan yang jelas.'],['日本語が話せるように、毎日練習しています。','Nihongo ga hanaseru yō ni, mainichi renshū shite imasu.','Saya berlatih setiap hari supaya bisa berbicara bahasa Jepang — target kemampuan atau keadaan.']]],
 ['～はず vs ～わけ',[['彼は来るはずです。','Kare wa kuru hazu desu.','Seharusnya dia datang — berdasarkan harapan atau informasi.'],['だから遅れたわけですね。','Dakara okureta wake desu ne.','Jadi, itulah sebabnya terlambat — menarik kesimpulan dari informasi.']]]];
const BP_STEP=[['N5','Kuasai partikel は・が・を・に・で, bentuk ます, ない, て, た, kata sifat, dan kalimat tanya.'],['N4','Latih perubahan kata kerja, pengalaman, syarat ～たら・～ば・～と・～なら, dan kewajiban.'],['N3','Belajar menyampaikan dugaan, pendapat, perubahan, pertentangan, dan hubungan sebab-akibat.'],['N2','Latih bacaan formal, argumen, kesimpulan, dan pola seperti ～ざるを得ない serta ～とは限らない.'],['N1','Pelajari ekspresi formal, tulisan abstrak, idiom, serta nuansa pola seperti ～を余儀なくされる dan ～ずにはいられない.']];
const bpEx=p=>`<div class="gx"><span>${p[3].replace(/\{(.+?)\}/g,'<b class="hl">$1</b>')}</span> <button class="sp" data-s="${p[3].replace(/[{}]/g,'')}">🔊</button><div class="ro" style="font-size:13px">${p[4]}</div><div class="rj">${p[5]}</div></div>`;
const bpFill=p=>[...p[3].matchAll(/\{(.+?)\}/g)].map(m=>m[1]).join(' … ');
const bub=e=>`<div class="bub">${e[0]} <button class="sp" data-s="${e[0]}">🔊</button><div class="rj ro">${e[1]}</div>${e[2]}</div>`;
function bunpo(){
 const tabs=[...BP.map(l=>l.l),'Perbandingan','Cara belajar'];
 if(!tabs.includes(bpL))bpL='N5';
 const lv=BP.find(l=>l.l==bpL);let body='',bar='';
 if(lv){
  const rows=bpRows(lv);
  body=`<div class="card"><b>${lv.l} · ${lv.t}</b> <span class="rj">(${rows.length} pola)</span><p class="rj" style="margin:4px 0 0">Fokus: ${lv.f}</p></div>
  ${lv.s.map(([t,r])=>`<h3>${t}</h3><div class="card">${r.map(p=>`<div class="gp"><div><b>${p[0]}</b><span class="ro">${p[1]}</span></div><div>${p[2]}</div>${p[3]?bpEx(p):''}</div>`).join('')}</div>`).join('')}
  ${lv.ex.length?`<h3>Contoh ${lv.l}</h3><div class="card">${lv.ex.map(bub).join('')}</div>`:''}
  ${lv.l=='N5'?`<details class="card"><summary><b>Contoh kalimat tiap partikel</b></summary>${PT.map(p=>`<div class="bub"><b>${p[0]}</b> <span class="ro">(${p[5]})</span> ${p[1]}<br>${p[2]} <button class="sp" data-s="${p[2]}">🔊</button><div class="rj ro">${p[4]}</div>${p[3]}</div>`).join('')}</details>`:''}`;
  bar=startBar();
 }else if(bpL=='Perbandingan'){
  body=`<p class="sub">Ada pola yang tampak mirip, tetapi penggunaannya berbeda. Jangan hanya menghafal terjemahan bahasa Indonesia.</p>${BP_CMP.map(([t,ex])=>`<h3>${t}</h3><div class="card">${ex.map(bub).join('')}</div>`).join('')}`;
 }else{
  body=`<p class="sub">Jangan menghafal semua pola sekaligus. Urutkan berdasarkan fungsi, karena banyak pola tingkat tinggi memakai bentuk dasar yang dipelajari di N5 dan N4.</p>${BP_STEP.map(([l,t],i)=>`<div class="card"><b>Tahap ${i+1} — ${l}</b><p style="margin:4px 0 0">${t}</p></div>`).join('')}
  <div class="card"><b>Catatan penting</b><p class="rj" style="margin:4px 0 0">JLPT tidak menerbitkan daftar resmi tunggal yang menjamin setiap pola bunpō masuk ke level tertentu. Daftar di sini adalah peta belajar berdasarkan pengelompokan yang umum dipakai buku persiapan JLPT, jadi ada pola yang bisa dikelompokkan berbeda antarreferensi.</p></div>`;
 }
 view(`${hdr('Bunpo · 文法')}<div class="tabs">${tabs.map(t=>`<button class="tg${t==bpL?' on':''}" data-bt="${t}">${t}</button>`).join('')}</div>${lv?'':'<p class="sub" style="margin:0 0 8px">文法 (bunpō) = tata bahasa. Urutan belajar: N5 → N4 → N3 → N2 → N1.</p>'}${body}${bar}`);
 onSpeak(app);
 app.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{bpL=b.dataset.bt;ST.set('bpL',bpL);bunpo()});
 if(!lv)return;
 const rows=bpRows(lv),pat=r=>`${r[0]}<small class="ro">${r[1]}</small>`,exR=rows.filter(r=>r[3]),plainEx=r=>r[3].replace(/[{}]/g,'');
 const othR=r=>shuf(rows.filter(x=>x!==r&&!bpSame(x[2],r[2]))).slice(0,6);
 // romaji bagian kosong dicari di romaji contoh kalimat; jika ketemu, romaji soal ditampilkan dengan bagian kosong
 const blRom=r=>{const plain=r[3].replace(/[{}]/g,'');let off=0;const sp=[...r[3].matchAll(/\{(.+?)\}/g)].map(m=>{const at=m.index-off;off+=2;return romFind(r[4],m[1],plain,at)});return sp.length&&sp.every(Boolean)?sp:null};
 const blankQ=r=>`<span style="font-size:20px">${r[3].replace(/\{.+?\}/g,'<span class="blank">＿＿</span>')}</span>`;
 const exInfo=r=>`${plainEx(r)} <span class="ro">(${r[4]})</span><br>Pola: ${r[0]} — ${r[2]}`;
 // isi kalimat: pilih pola yang mengisi bagian kosong
 const fillQ=r=>{const ans=bpFill(r),sp=blRom(r),orom={};let qr='';
  if(sp){qr=r[4];sp.slice().sort((a,b)=>b.start-a.start).forEach(f=>{qr=qr.slice(0,f.start)+'＿＿'+qr.slice(f.end)});orom[ans]=sp.map(f=>f.disp).join(' … ')}
  const d=[];for(const x of shuf(exR.filter(x=>x!==r&&!bpSame(x[2],r[2])))){if(d.length>=6)break;const fa=bpFill(x);if(fa===ans||d.includes(fa))continue;d.push(fa);const xs=blRom(x);if(xs)orom[fa]=xs.map(f=>f.disp).join(' … ')}
  return{kind:'choice',lbl:'Isi bagian yang kosong',q:blankQ(r),qr,a:ans,d,orom,mean:r[5],e:exInfo(r)}};
 const BC={jp:r=>`<span style="font-size:24px">${r[0]}</span>`,plain:r=>r[0],r:r=>r[1],a:r=>r[2],say:r=>r[3]?plainEx(r):null,oth:othR,jpOpt:pat,
  tiles:r=>r[3]?sentTok(plainEx(r)):null,lab:{j2a:'Pola → arti',a2j:'Arti → pola',susun:'Susun kalimat',ketikJ:'Ketik pola'},
  over:{
   susun:r=>{if(!r[3])return null;const it=sentItems([{j:plainEx(r),r:r[4],a:r[5],sub:'Pola: '+r[0]}],exR.map(x=>({j:plainEx(x),r:x[4]})))[0];return it?{kind:'susun',lbl:'Susun contoh kalimat',...it}:null},
   bicara:r=>SRok&&r[3]?{kind:'speak',lbl:'Ucapkan contoh kalimat ini',q:`<span style="font-size:20px">${plainEx(r)}</span>`,qr:r[4],say:plainEx(r),target:[plainEx(r)],ans:`${plainEx(r)} <span class="ro">(${r[4]})</span>`,mean:r[5]}:null,
   dengar:r=>r[3]?{kind:'choice',lbl:'Dengarkan, lalu pilih artinya',listen:true,q:'',qr:'',say:plainEx(r),a:r[5],d:shuf(exR.filter(x=>x!==r)).slice(0,6).map(x=>x[5]),e:exInfo(r)}:null,
   // ketik Jepang: isi bagian kosong contoh kalimat (kana atau romaji)
   ketikJ:r=>{if(!r[3])return null;const pieces=[...r[3].matchAll(/\{(.+?)\}/g)].map(m=>m[1]),sp=blRom(r);if(pieces.length!=1||!sp)return null;
    return{kind:'type',mode:'jp',lbl:'Ketik bagian yang kosong',q:blankQ(r),qr:r[4].slice(0,sp[0].start)+'＿＿'+r[4].slice(sp[0].end),accept:[pieces[0]],roms:[sp[0].disp],ans:`${pieces[0]} <span class="ro">(${sp[0].disp})</span>`,mean:r[5],sayAfter:plainEx(r),e:exInfo(r),ph:'Ketik dengan kana atau romaji…'}}}};
 const M=stdModes(BC);
 M.isi={lab:'Isi kalimat',icon:'📝',gen:r=>r[3]?fillQ(r):null};
 if(lv.l=='N5')M.partikel={lab:'Isi partikel',icon:'は',gen:()=>{const p=PQ[Math.floor(Math.random()*PQ.length)];return{kind:'choice',lbl:'Pilih partikel yang tepat',q:p[0],qr:p[2],a:p[1],d:PQ.map(x=>x[1])}}};

/* ===== SUSUN ala Duolingo =====
   item: {q (soal), sub (petunjuk), tokens:[jawaban berurutan], extra:[ubin pengecoh], ans (html jawaban), say, kana (true = tampilkan romaji di ubin)} */
const SMALLK=/^[ぁぃぅぇぉゃゅょゎァィゥェォャュョヮー]$/;
const kanaTok=s=>[...s].reduce((a,c)=>{if(a.length&&SMALLK.test(c))a[a.length-1]+=c;else a.push(c);return a},[]);

// akhiran kata kerja/sifat pendek yang ikut ditempel ke kata sebelumnya
const AUX=new Set(['て','た','だ','い','る','う','し','ん','れ','せ','ず','く','け','ろ','ば','たら','だら','たり','だり','ても','たい','よう','そう','さい']);
// potong kalimat menjadi ubin kata: partikel, akhiran, dan tanda baca ditempel ke kata sebelumnya
function sentTok(s){
 const raw=SEG?[...SEG.segment(s)].map(x=>x.segment):(s.match(/[一-龯々〆ヵヶ]+[ぁ-ゖ]*|[ァ-ヺー]+|[ぁ-ゖ]+|[A-Za-z0-9-]+|./g)||[]);
 const out=[];let pre='';
 const KJR=/[一-龯々〆ヵヶ0-9０-９]$/,KJONLY=/^[一-龯々〆ヵヶ0-9０-９]+$/;
 for(let t of raw){if(!t.trim())continue;
  const last=out.length?out[out.length-1]:'';
  // okurigana: hiragana setelah kanji (bukan partikel) ikut kata kanjinya, mis. 食+べ → 食べ
  if(!pre&&last&&KJR.test(last)&&/^[ぁ-ゖ]+$/.test(t)&&![...PARTS].some(p=>t.startsWith(p))){out[out.length-1]+=t;continue}
  // kanji tunggal digabung dengan kanji di sebelahnya, mis. 五+足 → 五足
  if(!pre&&last&&KJONLY.test(last)&&KJONLY.test(t)&&(last.length==1||t.length==1)){out[out.length-1]+=t;continue}
  // satu huruf hiragana lepas (mis. awalan お/ご) digabung ke kata berikutnya
  if(/^[ぁ-ゖ]$/.test(t)&&!PARTS.has(t)&&!AUX.has(t)){pre+=t;continue}
  t=pre+t;pre='';const prev=out.length?out[out.length-1]:null;
  const glue=prev&&!/^[「『（(]+$/.test(prev)&&(/^[。、！？!?」』）)…・〜～.,]+$/.test(t)||PARTS.has(t)||AUX.has(t)||/^(ます|まし|ませ|です|でし|ない|なかっ|てい|でい|られ|させ|ござい|した|しょう|せん)/.test(t));
  if(prev&&(glue||/^[「『（(]+$/.test(prev)))out[out.length-1]+=t;else out.push(t)}
 if(pre){if(out.length)out[out.length-1]+=pre;else out.push(pre)}
 while(out.length>9){let mi=0,ml=1e9;for(let i=0;i<out.length-1;i++){const l=out[i].length+out[i+1].length;if(l<ml){ml=l;mi=i}}out.splice(mi,2,out[mi]+out[mi+1])}
 return out}
// soal susun kalimat dari daftar {j, r, a, sub?}; pengecoh diambil dari kalimat lain di pool
function sentItems(list,pool){
 return list.map(x=>{const tk=sentTok(x.j);if(tk.length<2)return null;
  const ex=sentExtra(tk,pool);
  return{q:x.a,sub:x.sub||'',tokens:tk,extra:ex,tr:[...tokRom(x.j,x.r,tk),...ex.r],ans:`${x.j}<div class="ro" style="font-size:14px">${x.r}</div>`,say:x.j}}).filter(Boolean)}
function kanaExtra(tokens,pool,n=6){const ex=[];for(const c of shuf(pool)){if(ex.length>=n)break;if(!tokens.includes(c)&&!ex.includes(c))ex.push(c)}return ex}
const HIRA=[...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだでどばびぶべぼぱぴぷぺぽ'];

/* ----- bacaan kanji dari kamus kosakata, lalu dicocokkan dengan romaji asli kalimat -----
   Dipakai untuk menampilkan romaji pada kata berkanji (kuis lengkapi/isi kalimat).
   Bacaan hanya dipakai jika cocok dengan romaji kalimat, jadi romaji yang tampil selalu sesuai. */
let RD=null;const KJX=/[一-龯々〆ヵヶ]/;
function rdBuild(){RD=new Map();const add=(r,k)=>{if(!k)return;(RD.get(r)||RD.set(r,new Set()).get(r)).add(k)};
 const one=(j,k)=>{if(!KJX.test(j))return;const parts=j.split(/([一-龯々〆ヵヶ]+)/).filter(Boolean);
  const re=new RegExp('^'+parts.map(p=>KJX.test(p)?'(.+?)':p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('')+'$'),m=k.match(re);if(!m)return;
  let g=1;parts.forEach(p=>{if(KJX.test(p))add(p,m[g++])})};
 V.forEach(v=>one(v.j.replace(/^〜/,''),v.k));KJ.forEach(x=>{x.kun.forEach(r=>add(x.k,r.split('.')[0]));x.on.forEach(r=>add(x.k,r))})}
function runReads(run){const memo={};
 const go=i=>{if(i==run.length)return[''];if(memo[i])return memo[i];const out=[];
  for(let L=run.length-i;L>=1&&out.length<40;L--){const set=RD.get(run.slice(i,i+L));if(!set)continue;for(const r of set)for(const rest of go(i+L)){if(out.length>=40)break;out.push(r+rest)}}
  return memo[i]=out};return go(0)}
function tokReads(t){if(!RD)rdBuild();t=t.replace(/[。、！？!?「」『』（）()…・\s]/g,'');let acc=[''];
 for(const p of t.split(/([一-龯々〆ヵヶ]+)/).filter(Boolean)){
  if(!KJX.test(p)){acc=acc.map(a=>a+p);continue}const o=runReads(p);if(!o.length)return[];
  acc=acc.flatMap(a=>o.map(x=>a+x)).slice(0,60)}
 return acc}
// huruf romaji yang dinormalisasi + posisi aslinya (vokal panjang diringkas, tch = cch)
function rnormIdx(s){const out=[];
 for(let i=0;i<s.length;i++){const c=s[i].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');if(/^[a-z]$/.test(c))out.push({c,i})}
 const r=[];for(let k=0;k<out.length;k++){const a=out[k],p=r[r.length-1];
  if(a.c=='t'&&out[k+1]&&out[k+1].c=='c'&&out[k+2]&&out[k+2].c=='h'){r.push({c:'c',i:a.i});continue}
  if(p&&a.i==(p.e??p.i)+1&&((p.c=='o'&&/[ou]/.test(a.c))||(p.c=='u'&&a.c=='u')||(p.c=='a'&&a.c=='a')||(p.c=='i'&&a.c=='i')||(p.c=='e'&&/[ei]/.test(a.c)))){p.e=a.i;continue}
  r.push(a)}
 return r}
// cari romaji sebuah potongan kalimat (kana/kanji) di dalam romaji kalimat; hasil: {start,end,disp} atau null
// jpSent/jpAt: kalimat Jepang & posisi potongan di dalamnya, dipakai untuk memilih kemunculan yang letaknya paling sesuai
function romFind(sentRom,piece,jpSent,jpAt){if(!sentRom||!piece)return null;
 const R=rnormIdx(sentRom),S=R.map(x=>x.c).join(''),isL=ch=>/[a-zA-Zāīūēō]/.test(ch||'');
 const want=jpSent?((jpAt??jpSent.indexOf(piece))+piece.length/2)/jpSent.length:null;
 let best=null;
 for(const c of tokReads(piece)){
  // partikel di akhir ditulis terpisah di romaji (eki wa, mizu o, gakkou e)
  const b=c.slice(0,-1),vs=/は$/.test(c)?[rom(b)+' wa',rom(c)]:/を$/.test(c)?[rom(b)+' o',rom(c)]:/へ$/.test(c)?[rom(b)+' e',rom(c)]:[rom(c)];
  for(const v of vs){const nv=rnormIdx(v).map(x=>x.c).join('');if(!nv)continue;
   for(let at=S.indexOf(nv);at>=0;at=S.indexOf(nv,at+1)){const a=R[at],z=R[at+nv.length-1],start=a.i,end=(z.e??z.i)+1;
    const edge=(!isL(sentRom[start-1])?0:.25)+(!isL(sentRom[end])?0:.15),pos=want==null?0:Math.abs((start+end)/2/sentRom.length-want);
    const sc=pos+edge;if(!best||sc<best.sc)best={sc,start,end,disp:sentRom.slice(start,end).trim()}}}}
 return best}
// romaji tiap ubin kalimat, diambil dari romaji asli kalimat (bukan dibuat ulang), jadi partikel tetap benar (wa, o, e)
// ubin yang tidak ketemu diisi dari sisa romaji di antara ubin tetangganya
const TRC=new Map();
const rclean=s=>s.replace(/^[\s.,!?;:"'()…~\-]+|[\s.,!?;:"'()…~\-]+$/g,'');
function tokRom(j,r,tk){tk=tk||sentTok(j);const key=j+'\n'+tk.join('|');if(TRC.has(key))return TRC.get(key);
 const f=[];let at=0,end=0;
 // romaji ubin harus tepat menyambung romaji ubin sebelumnya (tidak ada huruf yang terlewat), kecuali ubin sebelumnya belum ketemu
 tk.forEach((t,k)=>{const x=r?romFind(r,t,j,at):null,free=k>0&&!f[k-1];
  const gap=x?rclean(r.slice(end,x.start)):'';
  // sisa 1–2 huruf (mis. partikel "o" di "tabako o") ikut ubin sebelumnya
  if(x&&x.start>=end&&(free||!/[a-zA-Z]/.test(gap)||(k>0&&gap.length<=2&&!/\s/.test(gap)))){if(k>0&&f[k-1]&&/[a-zA-Z]/.test(gap))f[k-1]={...f[k-1],disp:f[k-1].disp+' '+gap};f[k]=x;end=x.end}else f[k]=null;at+=t.length});
 const out=f.map(x=>x?rclean(x.disp):'');
 for(let k=0;k<tk.length;k++){if(f[k])continue;let e=k;while(e+1<tk.length&&!f[e+1])e++;
  const a=k?f[k-1].end:0,b=e+1<tk.length?f[e+1].start:r.length,gap=rclean(r.slice(a,b));
  if(gap){const w=gap.split(/\s+/);if(e==k)out[k]=gap;else if(w.length==e-k+1)w.forEach((x,i)=>out[k+i]=rclean(x))}
  k=e}
 // huruf besar di awal kalimat tidak ditampilkan supaya tidak membocorkan ubin pertama
 if(out[0]&&/^[A-Z][a-zāīūēō]/.test(out[0]))out[0]=out[0][0].toLowerCase()+out[0].slice(1);
 TRC.set(key,out);return out}
// ubin pengecoh dari kalimat lain (pool: [{j, r}]); romajinya ikut disimpan di ex.r
const sentExtra=(tk,pool,n=6)=>{const ex=[],er=[];for(const p of shuf(pool).slice(0,60)){if(ex.length>=n)break;const T=sentTok(p.j),k=Math.floor(Math.random()*T.length),x=T[k];
  if(x&&!tk.includes(x)&&!ex.includes(x)){ex.push(x);er.push(tokRom(p.j,p.r,T)[k])}}ex.r=er;return ex};
// soal "lengkapi kalimat": satu ubin dikosongkan; romaji soal & pilihan diambil dari romaji kalimat asli
function fillItem(l,pool){
 const tk=sentTok(l.j);if(tk.length<3)return null;
 for(const k of shuf(tk.map((_,x)=>x))){const t=tk[k];if(!/[ぁ-ゖァ-ヺ一-龯]/.test(t)||t.replace(/[。、！？!?「」]/g,'').length<2)continue;
  const at=tk.slice(0,k).join('').length,f=romFind(l.r,t,l.j,at);if(!f)continue;
  // pastikan posisinya berada di antara kata sebelum & sesudahnya
  const fp=k>0?romFind(l.r,tk[k-1],l.j,at-tk[k-1].length):null,fn=k<tk.length-1?romFind(l.r,tk[k+1],l.j,at+t.length):null;
  if((fp&&fp.end>f.start)||(fn&&fn.start<f.end))continue;
  const orom={[t]:f.disp},d=[];
  for(const x of shuf(pool).slice(0,200)){if(d.length>=6)break;if(x.j===l.j)continue;const u=shuf(sentTok(x.j))[0];
   if(!u||u===t||tk.includes(u)||d.includes(u)||!/[ぁ-ゖァ-ヺ一-龯]/.test(u))continue;const g=romFind(x.r,u,x.j);if(g){d.push(u);orom[u]=g.disp}}
  return{lbl:'Lengkapi kalimat',q:`<span style="font-size:21px">${tk.map((x,j)=>j==k?'<span class="blank">＿＿</span>':x).join('')}</span>`,qr:l.r.slice(0,f.start)+'＿＿'+l.r.slice(f.end),
   a:t,d,orom,mean:l.a,e:`${l.j} <span class="ro">(${l.r})</span>`}}
 return null}

const NK=['','一','二','三','四','五','六','七','八','九'],NH=['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
// bunyi khusus: 300 さんびゃく · 600 ろっぴゃく · 800 はっぴゃく · 3.000 さんぜん · 8.000 はっせん
const N100={1:'ひゃく',3:'さんびゃく',6:'ろっぴゃく',8:'はっぴゃく'},N1000={1:'せん',3:'さんぜん',8:'はっせん'};
// satu kelompok 4 digit (1–9999) → potongan [kanji, kana, nilai]; big = diikuti 万/億 (1000 → 一千 いっせん)
function num4(g,big){const d=[Math.floor(g/1000),Math.floor(g/100)%10,Math.floor(g/10)%10,g%10],o=[];
 if(d[0])o.push([d[0]==1?(big?'一千':'千'):NK[d[0]]+'千',d[0]==1&&big?'いっせん':N1000[d[0]]||NH[d[0]]+'せん',d[0]*1000]);
 if(d[1])o.push([d[1]==1?'百':NK[d[1]]+'百',N100[d[1]]||NH[d[1]]+'ひゃく',d[1]*100]);
 if(d[2])o.push([d[2]==1?'十':NK[d[2]]+'十',d[2]==1?'じゅう':NH[d[2]]+'じゅう',d[2]*10]);
 if(d[3])o.push([NK[d[3]],NH[d[3]],d[3]]);
 return o}
// angka → {n, k (kanji), h (kana), r (romaji), id (format Indonesia), p:[[kanji, kana, nilai]...]}; sampai 9.999 億 (< 1 triliun)
function jpNum(n){
 if(!n)return{n:0,k:'〇',h:'ゼロ',r:'zero',id:'0',p:[['〇','ゼロ',0]]};
 const U=[['',''],['万','まん'],['億','おく']],G=[];let x=n,u=0;
 while(x>0){G.unshift([x%10000,u]);x=Math.floor(x/10000);u++}
 const p=[];for(const[g,u]of G){if(!g)continue;const q=num4(g,u>0);
  if(u>0&&g==1)q[0]=['一','いち',1];
  const l=q[q.length-1];q[q.length-1]=[l[0]+U[u][0],l[1]+U[u][1],l[2]];q.forEach(z=>z[2]*=10000**u);p.push(...q)}
 return{n,k:p.map(z=>z[0]).join(''),h:p.map(z=>z[1]).join(''),r:p.map(z=>rom(z[1])).join(' '),id:n.toLocaleString('id-ID'),p}}
const fmtID=n=>n.toLocaleString('id-ID');
const NRANGE=[['dasar','0–10',0,10],['belas','Belasan',11,19],['puluh','Puluhan',20,99],['ratus','Ratusan',100,999],['ribu','Ribuan',1000,9999],['pribu','Puluhan & ratusan ribu',10000,999999],['juta','Jutaan',1000000,99999999]];
let nsel=ST.get('nsel',['belas','puluh','ratus']);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
// angka acak dari rentang; sebagian dibuat bulat (300, 8.000, 6.000.000) untuk melatih bunyi khusus
function numRand(r){const[, ,a,b]=r;if(b<=19||Math.random()>.4)return rnd(a,b);const m=10**Math.floor(Math.log10(a));return rnd(Math.ceil(a/m),Math.floor(b/m))*m}
// pengecoh: angka yang mirip (satu digit diganti, bunyi khusus ditukar) dari rentang yang sama
function numOth(x,n=6){const out=new Set(),s=String(x.n),r=NRANGE.find(z=>x.n>=z[2]&&x.n<=z[3])||NRANGE[0];
 for(let t=0;out.size<n&&t<60;t++){let y;
  if(t%2&&s.length>1){const i=rnd(0,s.length-1),d=rnd(i?0:1,9);y=+(s.slice(0,i)+d+s.slice(i+1))}else y=numRand(r);
  if(y!==x.n&&y>=r[2]&&y<=r[3])out.add(y)}

 <div class="grid">${PZ.map(p=>`<button class="mc" data-pz="${p[0]}"><span class="ic">${p[1]}</span><b>${p[2]}</b><small>${p[3]}</small></button>`).join('')}</div>
 <p class="rj" style="margin-top:12px">Level berlaku untuk Susun Hiragana, Katakana, Kotoba, Katsuyō, dan Bunpo.</p>`);
 $('#pzl').onchange=e=>{pzL=e.target.value;ST.set('pzL',pzL)};
 app.querySelectorAll('[data-pz]').forEach(b=>b.onclick=()=>pzStart(b.dataset.pz))}
function pzStart(m){
 const lvOk=v=>!pzL||v.l==pzL,L=pzL?` ${pzL}`:'',N=()=>QN();
 const word=(v,pool)=>{const tk=kanaTok(v.k);return{q:v.a,sub:v.t,tokens:tk,extra:kanaExtra(tk,pool),ans:`${v.j}${v.j!=v.k?` <span class="rj">${v.k}</span>`:''} <span class="ro">(${v.r})</span>`,say:v.k,kana:true}};
 const okLen=v=>{const n=kanaTok(v.k).length;return n>=2&&n<=7&&v.j[0]!='〜'&&!/[ ・]/.test(v.k)};
 if(m=='hira')return susun(`Susun Hiragana${L}`,()=>shuf(V.filter(v=>lvOk(v)&&okLen(v)&&/^[ぁ-ゖ]+$/.test(v.k))).slice(0,N()).map(v=>word(v,HIRA)),puzzle);
 if(m=='kata')return susun(`Susun Katakana${L}`,()=>shuf(V.filter(v=>lvOk(v)&&okLen(v)&&/^[ァ-ヺー]+$/.test(v.k))).slice(0,N()).map(v=>word(v,KATA)),puzzle);
 if(m=='kotoba')return susun(`Susun Kotoba${L}`,()=>shuf(V.filter(v=>lvOk(v)&&okLen(v)&&v.j!=v.k)).slice(0,N()).map(v=>({...word(v,HIRA),q:`<span style="font-size:30px">${v.j}</span>`,sub:`${v.a} · susun cara bacanya`})),puzzle);
 if(m=='katsu')return susun(`Susun Katsuyō${L}`,()=>shuf(KV.filter(lvOk)).slice(0,N()).map(v=>{const F=vForms(v).filter(x=>x.id!='kamus'),f=F[Math.floor(Math.random()*F.length)],tk=kanaTok(f.kana);
   return{q:`${f.lab} dari <b>${v.j}</b>`,sub:`${v.a} → ${f.arti}`,tokens:tk,extra:kanaExtra(tk,[...new Set(F.flatMap(x=>kanaTok(x.kana)))]),ans:`${f.jj}${f.jj!=f.kana?` <span class="rj">${f.kana}</span>`:''} <span class="ro">(${rom(f.kana)})</span>`,say:f.kana,kana:true}}),puzzle);
 if(m=='bunpo'){const ex=BP.filter(l=>!pzL||l.l==pzL).flatMap(l=>l.s.flatMap(s=>s[1]).filter(p=>p[3]).map(p=>({j:p[3].replace(/[{}]/g,''),r:p[4],a:p[5],sub:`Pola: ${p[0]} (${l.l})`})));
  return susun(`Susun Bunpo${L}`,()=>sentItems(shuf(ex).slice(0,N()+5),ex),puzzle)}
 if(m=='kaiwa'){const ln=KW.flatMap(d=>d[2].map(l=>({j:l[1],r:l[2],a:l[3],sub:`${d[1]} · ${l[0]}`})));
  return susun('Susun Kaiwa',()=>sentItems(shuf(ln).slice(0,N()+5),ln),puzzle)}
 if(m=='bun')return susun('Susun Bun',()=>sentItems(shuf(BUN).slice(0,N()+5).map(b=>({j:b[1],r:b[2],a:b[3],sub:b[0]})),BUN.map(b=>({j:b[1],r:b[2]}))),puzzle);
}

const miniStroke=(k,sz)=>{const s=(KJM[k]||{}).s||[];if(!s.length)return`<div class="ms nk" style="${sz?`width:${sz}px;height:${sz}px`:''}"><b>${k}</b></div>`;

function msLoop(root){
 root.querySelectorAll('svg.ms').forEach(sv=>{let t=0,on=false;const n=+sv.dataset.n||1;
  const play=()=>{clearTimeout(t);if(!sv.isConnected||!on)return;sv.classList.remove('go');void sv.getBoundingClientRect();sv.classList.add('go');t=setTimeout(play,n*520+2200)};
  sv.onclick=()=>{on=true;play()};
  if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{es.forEach(e=>{on=e.isIntersecting;if(on)play();else clearTimeout(t)});if(!sv.isConnected)io.disconnect()});io.observe(sv)}else{on=true;play()}})}

/* ===== KOMPONEN KANJI RINCI (bushu bisa lebih dari 2) =====
   Komponen utama dipecah lagi memakai sub-komponen KanjiVG selama sub-komponennya menutup semua goresan,
   bukan goresan tunggal (丿 丶 …), dan bukan bushu (radikal tetap utuh). Contoh: 働 = 亻 + 動 → 亻 + 重 + 力.
   Hasil: komponen dengan [6] = komponen asal (mis. "動"). */
let kDeep=ST.get('kDeep',true);
// kanji yang juga bushu klasik (radikal Kangxi) tidak dipecah lagi, mis. 重 tidak menjadi 千 + 里
const KRAD=new Set([...'一丨丶丿乙亅二亠人儿入八冂冖冫几凵刀力勹匕匚匸十卜卩厂厶又口囗土士夂夕大女子宀寸小尢尸屮山巛工己巾干幺广廴廾弋弓彐彡彳心戈戸手支攴文斗斤方无日曰月木欠止歹殳毋比毛氏气水火爪父爻爿片牙牛犬玄玉瓜瓦甘生用田疋疒癶白皮皿目矛矢石示禸禾穴立竹米糸缶网羊羽老而耒耳聿肉臣自至臼舌舛舟艮色艸虍虫血行衣西見角言谷豆豕豸貝赤走足身車辛辰辵邑酉釆里金長門阜隶隹雨青非面革韋韭音頁風飛食首香馬骨高髟鬥鬯鬲鬼魚鳥鹵鹿麦麻黄黍黒黹黽鼎鼓鼠鼻齊歯竜亀龠重']);
function kjDeep(k){
 const srt=a=>[...a].sort((x,y)=>x-y).join(),cov=(ps,p)=>srt(ps.flatMap(x=>x[4]))===srt(p[4]);
 // bagian tanpa nama ('?') diganti sub-komponennya yang bernama, jika menutup semua goresannya
 const resolve=p=>{if(p[0]!='?')return[p];if(!p[5].length)return null;const out=[];for(const s of p[5]){const r=resolve(s);if(!r)return null;out.push(...r)}return cov(out,p)?out:null};
 const one=p=>{if(p[3].includes('r')||KRAD.has(p[0])||RADN[p[0]])return[p];
  if(p[0]=='?'){const r=resolve(p);return r?r.map(x=>[x[0],x[1],x[2]||p[2],x[3],x[4],x[5],'']):[p]}
  const out=[];for(const s of p[5]){const r=resolve(s);if(!r)return[p];out.push(...r)}
  if(out.length<2||!cov(out,p)||out.some(x=>PSTR.has(x[0])||!/^.$/u.test(x[0]))||!out.some(x=>x[2]))return[p];
  return out.map(x=>[x[0],x[1],x[2]||p[2],x[3],x[4],x[5],p[0]])};
 return(k.p||[]).flatMap(one)}
const kjParts=k=>{const d=kjDeep(k);return kDeep&&d.length>(k.p||[]).length?d:(k.p||[])};

/* ===== KANJI FAMILY TREE =====
   Akar → kanji yang memakai akar itu sebagai komponen langsung → generasi berikutnya. Di atas akar: komponen penyusunnya. */
let KDIR=null;
function dirBuild(){KDIR=new Map();KJ.forEach(k=>{const s=new Set();(k.p||[]).forEach(p=>{if(p[0]!='?')s.add(p[0]);if(p[1])s.add(p[1])});s.delete(k.k);s.forEach(e=>(KDIR.get(e)||KDIR.set(e,[]).get(e)).push(k))})}
const kjDir=e=>{if(!KDIR)dirBuild();return KDIR.get(e)||[]};
const nodeMean=e=>KJM[e]?KJM[e].a:(RADN[e]?RADN[e][1]:'komponen');
const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function treeView(host,root,opt={}){
 const lvI=l=>({N5:0,N4:1,N3:2,N2:3,N1:4})[l]??5,rank=a=>[...a].sort((x,y)=>kjDir(y.k).length-kjDir(x.k).length||lvI(x.l)-lvI(y.l));
 const rk=KJM[root],parents=rk?(rk.p||[]).filter(p=>p[0]!='?'&&!PSTR.has(p[0])).map(p=>p[0]):[];
 const kids=rank(kjDir(root).filter(x=>x.k!=root)).slice(0,6).map(c=>({e:c.k,kids:rank(kjDir(c.k).filter(g=>g.k!=root&&g.k!=c.k)).slice(0,3).map(g=>({e:g.k}))}));
 const G=62,leaves=kids.reduce((s,c)=>s+Math.max(1,c.kids.length),0),W=Math.max(330,leaves*G+20,parents.length*72+20);
 const yP=44,yR=parents.length?156:56,yC=yR+118,yG=yC+108,H=(kids.some(c=>c.kids.length)?yG:kids.length?yC:yR)+64;
 const rx=W/2,nodes=[],lines=[];let x=(W-leaves*G)/2,d=0;
 const elbow=(x1,y1,x2,y2)=>{const m=(y1+y2)/2;return`M${x1} ${y1}V${m}H${x2}V${y2}`};
 parents.forEach((p,i)=>{const px=rx+(i-(parents.length-1)/2)*72;nodes.push({e:p,x:px,y:yP,r:21,c:'par',d:d++});lines.push([elbow(px,yP+21,rx,yR-31),'par'])});
 nodes.push({e:root,x:rx,y:yR,r:31,c:'root',d:d++});
 kids.forEach(c=>{const n=Math.max(1,c.kids.length),cx=x+n*G/2;nodes.push({e:c.e,x:cx,y:yC,r:25,c:'kid',d:d++});lines.push([elbow(rx,yR+31,cx,yC-25),'kid']);
  c.kids.forEach((g,j)=>{const gx=x+(j+.5)*G;nodes.push({e:g.e,x:gx,y:yG,r:21,c:'gk',d:d++});lines.push([elbow(cx,yC+25,gx,yG-21),'gk'])});x+=n*G});
 const node=n=>{const kj=KJM[n.e];return`<g class="tn ${n.c}${kj?'':' comp'}" data-n="${n.e}" tabindex="0" role="button" aria-label="${n.e} ${esc(nodeMean(n.e))}" style="--d:${n.d*70}ms"><circle cx="${n.x}" cy="${n.y}" r="${n.r}"/><text x="${n.x}" y="${n.y+1}" class="tk" style="font-size:${n.r*.95}px">${n.e}</text><text x="${n.x}" y="${n.y+n.r+15}" class="tl">${esc(cut(nodeMean(n.e),11))}</text></g>`};
 host.innerHTML=`<div class="ktree"><div class="tth"><b>🌳 Kanji Family Tree</b><span class="rj">Jelajahi hubungan antar kanji</span></div>
 ${opt.chips&&opt.chips.length>1?`<div class="tabs tchips">${opt.chips.map(c=>`<button class="tg${c==root?' on':''}" data-r="${c}">${c}</button>`).join('')}</div>`:''}
 <div class="tsv"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Pohon keluarga ${root}">${lines.map((l,i)=>`<path class="tln ${l[1]}" d="${l[0]}" pathLength="1" style="--d:${i*70}ms"/>`).join('')}${nodes.map(node).join('')}</svg></div>
 ${!kids.length?`<p class="rj" style="text-align:center;margin:4px 0 0">Belum ada kanji lain di daftar yang memakai ${root} sebagai komponen.${parents.length?' Ketuk komponen di atas untuk melihat keluarganya.':''}</p>`:''}
 <p class="tleg"><span class="lg par"></span>komponen penyusun <span class="lg kid"></span>kanji turunan <span class="lg gk"></span>generasi berikutnya · ketuk lingkaran untuk menjelajah</p></div>`;
 const go=e=>{sfx.tap();if(opt.onPick)opt.onPick(e);else treeView(host,e,opt)};
 host.querySelectorAll('.tn').forEach(g=>{g.onclick=()=>{if(g.dataset.n!=root)go(g.dataset.n)};g.onkeydown=ev=>{if(ev.key=='Enter'&&g.dataset.n!=root)go(g.dataset.n)}});
 host.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(b.dataset.r!=root)treeView(host,b.dataset.r,opt)});
 const sv=host.querySelector('.tsv');sv.scrollLeft=(sv.scrollWidth-sv.clientWidth)/2}

/* ===== GENERATOR SOAL BERSAMA (Beranda, Quiz, Review) =====
   Entri: {t:'W'|'K'|'G'|'S', x:data, l:level} */
const big=(s,n)=>`<span class="big1" style="font-size:${n||([...s].length>3?34:[...s].length>2?42:52)}px">${s}</span>`;
const wOpt=v=>`${v.j}${v.j!=v.k?`<small>${v.k}</small>`:''}<small class="ro">${v.r}</small>`;
const oW=v=>{let o=V.filter(y=>y.l==v.l&&y.t==v.t&&y.a!=v.a&&y.k!=v.k);if(o.length<6)o=V.filter(y=>y.t==v.t&&y.a!=v.a&&y.k!=v.k);return shuf(o).slice(0,6)};
const oK=k=>{let o=KJ.filter(y=>y.l==k.l&&y!==k&&y.a!=k.a);if(o.length<6)o=KJ.filter(y=>y!==k&&y.a!=k.a);return shuf(o).slice(0,6)};
const bpLvRows=L=>{const b=BP.find(x=>x.l==L);return b?bpRows(b):[]};
const oG=(r,L)=>shuf(bpLvRows(L).filter(y=>y!==r&&!bpSame(y[2],r[2]))).slice(0,6);
const oS=b=>shuf(BUN.filter(y=>y!==b&&y[3]!=b[3])).slice(0,6);
const GEN={
 W:[v=>({kind:'choice',lbl:'Apa artinya?',q:big(v.j)+(v.j!=v.k?`<br><small style="font-weight:400">${v.k}</small>`:''),qr:v.r,say:v.k,a:v.a,d:oW(v).map(x=>x.a)}),
  v=>{const o=oW(v);return{kind:'choice',lbl:'Pilih bahasa Jepangnya',q:v.a,qr:'',a:wOpt(v),d:o.map(wOpt),nr:true,om:Object.fromEntries([v,...o].map(x=>[wOpt(x),x.a])),say:v.k,sayAfter:v.k}},
  v=>({kind:'choice',lbl:'Dengarkan, lalu pilih artinya',q:v.j,listen:true,qr:'',say:v.k,a:v.a,d:oW(v).map(x=>x.a),e:jp(v)}),
  v=>{const tk=kanaTok(v.k);if(tk.length<2||tk.length>6)return null;return{kind:'susun',lbl:'Susun kata ini',q:v.a,sub:v.j!=v.k?v.j:'',tokens:tk,extra:kanaExtra(tk,/^[ァ-ヺー]+$/.test(v.k)?KATA:HIRA),ans:jp(v),say:v.k,kana:true}}],
 K:[k=>({kind:'choice',lbl:'Apa arti kanji ini?',q:big(k.k,56),qr:'',say:k.kun.length?k.kun[0].replace('.',''):k.on[0],sayAfter:k.kun.length?k.kun[0].replace('.',''):k.on[0],a:k.a,d:oK(k).map(x=>x.a),e:kjRead(k)}),
  k=>({kind:'choice',lbl:'Pilih kanjinya',q:k.a,qr:'',a:kjOpt(k),d:oK(k).map(kjOpt),nr:true}),
  k=>({kind:'choice',lbl:'Pilih cara bacanya',q:big(k.k,56),qr:'',a:kjRead(k),d:oK(k).map(kjRead),mean:k.a})],
 G:[(r,L)=>({kind:'choice',lbl:'Apa arti pola ini?',q:r[0],qr:r[1],a:r[2],d:oG(r,L).map(x=>x[2])}),
  (r,L)=>{const p=x=>`${x[0]}<small class="ro">${x[1]}</small>`;return{kind:'choice',lbl:'Pilih polanya',q:r[2],qr:'',a:p(r),d:oG(r,L).map(p),nr:true}}],
 S:[b=>({kind:'choice',lbl:'Apa arti kalimat ini?',q:`<span style="font-size:21px">${b[1]}</span>`,qr:b[2],say:b[1],a:b[3],d:oS(b).map(x=>x[3])}),
  b=>{const it=sentItems([{j:b[1],r:b[2],a:b[3]}],BUN.map(x=>({j:x[1],r:x[2]})))[0];return it?{kind:'susun',lbl:'Susun kalimatnya',...it}:null}]};
// satu soal dari satu entri: mode pertama (mengenali) atau mode acak lain
function genItem(en,first){const g=GEN[en.t];if(first)return g[0](en.x,en.l);for(const f of shuf(g)){const it=f(en.x,en.l);if(it)return it}return g[0](en.x,en.l)}
function mixItems(ents,n){const E=shuf(ents),out=[];for(let i=0;out.length<n&&i<E.length*3;i++){const it=genItem(E[i%E.length],i<Math.min(4,E.length));if(it)out.push(it)}return out}

/* ===== PEMBELAJARAN BERTAHAP (Beranda) =====
   - Setiap materi (kata, kanji, pola, kalimat) punya tingkat hafalan 0–6 yang disimpan di perangkat (nh_mem).
     Benar +1, salah −2. Dianggap HAFAL jika tingkatnya ≥ 4.
   - Setiap pelajaran memperkenalkan materi baru, lalu mengulang materi dari pelajaran sebelumnya yang belum hafal.
   - Jenis soal: arti (pilih arti / pilih bahasa Jepang / dengar), lengkapi kalimat, susun kata & kalimat, cocokkan arti. */
const HAFAL=4;
const memKey=en=>en.t+':'+(en.t=='W'?en.x.j+'|'+en.x.k:en.t=='K'?en.x.k:en.t=='G'?en.x[0]:en.x[1]);
const MEM=()=>ST.get('mem',{});
function memUpd(key,ok){const m=MEM();m[key]=Math.max(0,Math.min(6,(m[key]||0)+(ok?1:-2)));ST.set('mem',m)}
const memOf=(M,en)=>M[memKey(en)];
// kumpulan kalimat contoh untuk soal "lengkapi kalimat" dan "susun kalimat"
// p = prioritas sumber (kecil = lebih sederhana): kalimat dasar → Bun → contoh bunpō/onomatope → dialog Kaiwa
let SIDX=null;
function sentIdx(){if(SIDX)return SIDX;
 SIDX=[...KD.map(b=>({j:b[1],r:b[2],a:b[3],p:0})),...BUN.map(b=>({j:b[1],r:b[2],a:b[3],p:1})),
  ...BT.flatMap(t=>t.rows.map(r=>({j:r[3],r:r[4],a:r[5],p:2}))),
  ...KP.flatMap(m=>m.cats.flatMap(c=>c.pair?[]:c.rows.filter(r=>r[4]).map(r=>({j:r[4],r:r[5],a:r[6],p:2})))),
  ...BP.flatMap(l=>bpRows(l).filter(r=>r[3]).map(r=>({j:r[3].replace(/[{}]/g,''),r:r[4],a:r[5],p:3}))),
  ...KW.flatMap(d=>d[2].map(l=>({j:l[1],r:l[2],a:l[3],p:4})))].filter(s=>s.j&&s.j.length<=34);
 return SIDX}
// panjang kalimat maksimum per level: pemula memakai kalimat pendek dulu
const SMAX={N5:14,N4:20,Kerja:20};
// kalimat pendek otomatis untuk kata benda konkret: これは本です。 / ここは駅です。 / あの人は先生です。

const PLV=[['N5','Pemula'],['N4','Dasar lanjutan'],['N3','Menengah'],['N2','Menengah atas'],['N1','Mahir'],['Kerja','Kerja pabrik']];

const EASYT=['Ungkapan','Kata ganti','Kata tunjuk','Kata tanya','Bilangan','Keterangan waktu'];
const PATHC={};
function pathLevel(L){if(PATHC[L])return PATHC[L];
 const W=V.filter(v=>v.l==L&&v.j[0]!='〜').map(v=>({v,s:[...v.k].length+(EASYT.includes(v.t)?-1.5:0)+(v.j!=v.k?.4:0)})).sort((a,b)=>a.s-b.s).map(x=>({t:'W',x:x.v,l:L}));
 const K=KJ.filter(k=>k.l==L).map(k=>({t:'K',x:k,l:L}));
 const G=bpLvRows(L).map(r=>({t:'G',x:r,l:L}));
 const BS=[...BUN].sort((a,b)=>a[1].length-b[1].length),half=Math.ceil(BS.length/2);
 const S=(L=='N5'?BS.slice(0,half):L=='N4'?BS.slice(half):[]).map(b=>({t:'S',x:b,l:L}));
 const ch=(a,n,t)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push({t,e:a.slice(i,i+n)});return o};
 const Q={W:ch(W,8,'W'),K:ch(K,5,'K'),G:ch(G,5,'G'),S:ch(S,6,'S')},seq=[];
 while(Object.values(Q).some(a=>a.length))for(const t of['W','W','K','W','G','S'])if(Q[t].length)seq.push(Q[t].shift());
 seq.forEach((ls,i)=>{ls.id=`${L}:${i}`;ls.no=Object.values(seq.slice(0,i+1)).filter(x=>x.t==ls.t).length});

 for(let i=0,u=0;i<seq.length;i+=6,u++){const ls=seq.slice(i,i+6),nodes=[];
  ls.forEach((l,j)=>{nodes.push({k:'L',ls:l,id:l.id});if(j==2&&ls.length>3)nodes.push({k:'C',id:`${L}:c${u}`})});

function lessonLabel(ls, seqIndex) {
 const num = String(seqIndex + 1).padStart(2, '0');
 if (ls.t === 'W') {
  if (seqIndex === 0) return `${num}. Vokal Hiragana`;
  if (seqIndex === 1) return `${num}. Salam & Aisatsu`;
  const types = ls.e.map(e => e.x.t);
  const t = types.find(x => x) || '';
  if (t.includes('ganti')) return `${num}. Kata Ganti`;
  if (t.includes('tunjuk')) return `${num}. Kata Tunjuk`;
  if (t.includes('tanya')) return `${num}. Kata Tanya`;
  if (t.includes('Bilangan') || t.includes('hitung')) return `${num}. Angka & Hitungan`;
  if (t.includes('waktu')) return `${num}. Waktu & Hari`;
  if (t.includes('sifat')) return `${num}. Kata Sifat`;
  if (t.includes('kerja')) return `${num}. Kata Kerja`;
  return `${num}. Kosakata Dasar`;
 }
 if (ls.t === 'K') {
  const c = ls.e[0]?.x?.c;
  return `${num}. Kanji ${c ? c.split(' & ')[0] : 'Dasar'}`;
 }
 if (ls.t === 'G') return `${num}. Pola Kalimat`;
 if (ls.t === 'S') {
  const c = ls.e[0]?.x[0];
  return `${num}. Kalimat ${c ? c.split(' ')[0] : 'Dasar'}`;
 }
 return `${num}. Pelajaran ${ls.no}`;
}

function beranda(){

   const p0=pts[j-1],p1=pts[j],midY=(p0.y+p1.y)/2;

  const lmHtml=`<div class="plandmark" style="left:73.5%;top:65px">

  const nodesHtml=pts.map(({n,j,x,y})=>{
   const S=st[n.id];
   const isCur=S==='cur'||(n.k==='C'&&S==='open');

   let title='',status='';
   if(n.k==='L'){
    title=lessonLabel(n.ls,gi);

   }else if(n.k==='C'){
    title='Peti Hadiah';

    if(isDone)icHtml=`<svg viewBox="0 0 24 24" class="pico"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function nodePop(btn,PL,st){
